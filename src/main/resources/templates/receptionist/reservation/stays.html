<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Current Stays | Hospi</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.9/cdn.min.js" defer></script>
</head>

<body class="staff-layout">

<div th:replace="~{/fragments/receptionist-sidebar :: sidebar}"></div>

<main class="staff-page">

    <div th:replace="~{fragments/components/toast :: toast}"></div>

    <header class="staff-page-header">

        <div class="flex items-center gap-4">

            <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-primary/10 text-primary">
                <img th:src="@{/assets/icons/users.svg}" alt="">
            </div>

            <div>
                <h1 class="staff-page-title">Current Stays</h1>
                <p class="page-description">
                    Currently active stays in the hotel.
                </p>
            </div>

        </div>

    </header>

    <section class="overflow-hidden card">

        <div class="flex gap-1 border-b border-border px-5 pt-3 pb-0">
            <a th:href="@{/receptionist/stays(search=${view.checkedInSearch})}"
               th:classappend="${activeScope == 'all'} ? 'border-primary text-primary' : 'border-transparent text-muted-foreground hover:text-foreground'"
               class="px-3 py-2 text-sm font-medium border-b-2 transition">All</a>
            <a th:href="@{/receptionist/stays(scope='today', search=${view.checkedInSearch})}"
               th:classappend="${activeScope == 'today'} ? 'border-primary text-primary' : 'border-transparent text-muted-foreground hover:text-foreground'"
               class="px-3 py-2 text-sm font-medium border-b-2 transition">Today</a>
        </div>

        <form th:action="@{/receptionist/stays}" method="get"
              class="flex items-center gap-4 border-b border-border px-5 py-4" novalidate>
            <input type="hidden" name="scope" th:value="${activeScope}">
            <input type="text" name="search" placeholder="Search by name, phone or booking code..."
                   class="input flex-1" th:value="${view.checkedInSearch()}">
            <button type="submit" class="btn btn-primary btn-sm">Search</button>
            <a th:href="@{/receptionist/stays}" class="btn btn-ghost btn-sm">Clear</a>
        </form>

        <div class="overflow-x-auto">

            <table class="w-full">

                <thead>
                <tr class="border-b border-border text-muted-foreground">
                    <th class="px-5 py-4 text-left text-sm font-medium">Guest</th>
                    <th class="px-5 py-4 text-left text-sm font-medium">Registered</th>
                    <th class="px-5 py-4 text-left text-sm font-medium">Rooms</th>
                    <th class="px-5 py-4 text-left text-sm font-medium">Room Types</th>
                    <th class="px-5 py-4 text-left text-sm font-medium">Check-In</th>
                    <th class="px-5 py-4 text-left text-sm font-medium">Check-Out</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="g : ${view.guests()}"
                    th:attr="data-id=${g.id}"
                    x-data
                    x-on:click="window.location.href = '/receptionist/stays/' + $el.dataset.id"
                    class="border-t border-border hover:bg-muted/50 cursor-pointer">

                    <td class="px-5 py-4">
                        <p class="font-medium text-foreground"
                           th:text="${g.guestName}">
                            John Smith
                        </p>
                        <p class="text-sm text-muted-foreground truncate max-w-[200px]"
                           th:text="${g.guestPhone}">
                            +84 912 345 678
                        </p>
                    </td>

                    <td class="px-5 py-4 text-sm text-muted-foreground"
                        th:text="${guestCounts.get(g.id)} ?: '0'">
                        3
                    </td>

                    <td class="px-5 py-4">
                        <span class="text-sm text-muted-foreground">
                            <span th:text="${assignedCounts.get(g.id)} ?: 0">1</span>/<span th:text="${#aggregates.sum(g.details.![roomCount()])}">2</span>
                        </span>
                    </td>

                    <td class="px-5 py-4 max-w-[200px]">
                        <div class="truncate">
                            <span class="pill-muted text-xs" th:each="d : ${g.details}"
                                  th:text="${d.roomTypeName} + ' x' + ${d.roomCount}">
                                Deluxe x2
                            </span>
                        </div>
                    </td>

                    <td class="px-5 py-4 text-sm text-muted-foreground"
                        th:text="${#temporals.format(g.checkInAt, 'dd/MM')}">
                        15/06
                    </td>

                    <td class="px-5 py-4 text-sm text-muted-foreground"
                        th:text="${#temporals.format(g.checkOutAt, 'dd/MM')}">
                        18/06
                    </td>

                </tr>

                </tbody>

                <tfoot th:if="${view.totalPages() > 1}">
                    <tr>
                        <td colspan="6" class="px-5 py-3">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <a th:href="@{/receptionist/stays(scope=${activeScope}, search=${view.checkedInSearch()}, page=${view.page() - 1})}"
                                       th:classappend="${view.page() == 0} ? 'pointer-events-none opacity-50' : ''"
                                       class="btn btn-ghost btn-sm">&larr; Prev</a>

                                    <div class="flex items-center gap-1">
                                        <a th:href="@{/receptionist/stays(scope=${activeScope}, search=${view.checkedInSearch()}, page=0)}"
                                           th:classappend="${view.page() == 0} ? 'btn-primary' : 'btn-ghost'"
                                           class="btn btn-sm w-8 justify-center">1</a>

                                        <span th:if="${view.page() > 2}"
                                              class="px-1 text-xs text-muted-foreground">&hellip;</span>

                                        <div th:if="${view.totalPages() > 2}"
                                             class="flex items-center gap-1">
                                            <a th:each="p : ${#numbers.sequence(1, view.totalPages() - 2)}"
                                               th:if="${p >= view.page() - 1 and p <= view.page() + 1}"
                                               th:href="@{/receptionist/stays(scope=${activeScope}, search=${view.checkedInSearch()}, page=${p})}"
                                               th:classappend="${p == view.page()} ? 'btn-primary' : 'btn-ghost'"
                                               class="btn btn-sm w-8 justify-center"
                                               th:text="${p + 1}">2</a>
                                        </div>

                                        <span th:if="${view.page() < view.totalPages() - 3}"
                                              class="px-1 text-xs text-muted-foreground">&hellip;</span>

                                        <a th:href="@{/receptionist/stays(scope=${activeScope}, search=${view.checkedInSearch()}, page=${view.totalPages() - 1})}"
                                           th:classappend="${view.page() == view.totalPages() - 1} ? 'btn-primary' : 'btn-ghost'"
                                           class="btn btn-sm w-8 justify-center"
                                           th:text="${view.totalPages()}">10</a>
                                    </div>

                                    <a th:href="@{/receptionist/stays(scope=${activeScope}, search=${view.checkedInSearch()}, page=${view.page() + 1})}"
                                       th:classappend="${view.page() >= view.totalPages() - 1} ? 'pointer-events-none opacity-50' : ''"
                                       class="btn btn-ghost btn-sm">Next &rarr;</a>
                                </div>

                                <div class="flex items-center gap-2">
                                    <span class="text-sm text-muted-foreground">
                                        Page <span th:text="${view.page() + 1}">1</span>/<span th:text="${view.totalPages()}">1</span>
                                    </span>

                                    <form th:action="@{/receptionist/stays(scope=${activeScope}, search=${view.checkedInSearch()})}"
                                          method="get" class="flex items-center gap-1"
                                          onsubmit="const input = this.querySelector('[name=page]'); input.value = parseInt(input.value) - 1 || 0;">
                                        <input type="hidden" name="search" th:value="${view.checkedInSearch()}">
                                        <input type="hidden" name="scope" th:value="${activeScope}">
                                        <input type="number" name="page" min="1" th:max="${view.totalPages()}"
                                               class="input input-sm w-16 text-center" placeholder="#"
                                               th:value="${view.page() + 1}">
                                        <button type="submit" class="btn btn-ghost btn-sm px-2">Go</button>
                                    </form>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tfoot>

            </table>

        </div>

    </section>

</main>

</body>
</html>
