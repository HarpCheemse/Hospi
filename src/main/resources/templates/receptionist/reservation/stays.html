<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Current Stays | Hospi</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.9/cdn.min.js" defer></script>
</head>

<body class="staff-layout">

<div th:replace="~{/fragments/receptionist-sidebar :: sidebar}"></div>

<main class="staff-page">

    <div th:replace="~{fragments/components/toast :: toast}"></div>

    <header class="staff-page-header">

        <div class="flex items-center gap-4">

            <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-primary/10 text-primary">
                <img th:src="@{/assets/icons/users.svg}" alt="">
            </div>

            <div>
                <h1 class="staff-page-title">Current Stays</h1>
                <p class="page-description">
                    Currently active stays in the hotel.
                </p>
            </div>

        </div>

    </header>

    <section class="card">

        <div class="border-b border-border px-6 py-5">
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div>
                        <h2 class="text-xl font-semibold">Checked-In Guests</h2>
                        <p class="mt-1 text-sm text-muted-foreground">Manage active guest stays</p>
                    </div>
                </div>
                <form th:action="@{/receptionist/stays/stays}" method="get" class="flex items-center gap-2" novalidate>
                    <input type="text" name="search" placeholder="Search by name or phone..."
                           class="input" th:value="${view.checkedInSearch()}">
                    <button type="submit" class="btn btn-primary btn-sm">Filter</button>
                    <a th:href="@{/receptionist/stays/stays}" class="btn btn-secondary btn-sm">Clear</a>
                </form>
            </div>
        </div>

        <div class="overflow-x-auto">

            <table class="w-full">

                <thead class="bg-muted">

                <tr>
                    <th class="px-5 py-4 text-left text-sm font-medium text-muted-foreground">
                        Guest Name
                    </th>

                    <th class="px-5 py-4 text-left text-sm font-medium text-muted-foreground">
                        Room(s)
                    </th>

                    <th class="px-5 py-4 text-left text-sm font-medium text-muted-foreground">
                        Check-In
                    </th>

                    <th class="px-5 py-4 text-left text-sm font-medium text-muted-foreground">
                        Phone
                    </th>

                    <th class="px-5 py-4 text-right text-sm font-medium text-muted-foreground">
                        Actions
                    </th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="g : ${view.guests()}"
                    class="border-t border-border">

                    <td class="px-5 py-4">
                        <p class="font-medium text-foreground"
                           th:text="${g.guestName}">
                            John Smith
                        </p>
                        <p class="text-sm text-muted-foreground max-w-[200px] truncate"
                           th:text="${g.guestEmail}">
                            john@hospi.com
                        </p>
                    </td>

                    <td class="px-5 py-4">
                        <div class="flex flex-wrap gap-1">
                            <th:block th:each="detail : ${g.details}">
                                <span class="pill-muted"
                                      th:text="${detail.roomType.name} + ' x' + ${detail.roomCount}">
                                    Deluxe x2
                                </span>
                            </th:block>
                            <span th:if="${#lists.isEmpty(g.details)}"
                                  class="text-sm text-muted-foreground">
                                —
                            </span>
                        </div>
                    </td>

                    <td class="px-5 py-4 text-sm text-muted-foreground"
                        th:text="${#temporals.format(g.checkInAt, 'dd MMM yyyy')}">
                        15 Jun 2026
                    </td>

                    <td class="px-5 py-4 text-sm text-foreground"
                        th:text="${g.guestPhone}">
                        +84 912 345 678
                    </td>

                    <td class="px-5 py-4 text-right">
                        <a th:href="@{/receptionist/stays/{id}/manage(id=${g.id})}"
                           class="btn btn-primary btn-sm">Manage</a>
                        <a th:href="@{/receptionist/stays/{id}/checkout(id=${g.id})}"
                           class="btn btn-secondary btn-sm">Check-Out</a>
                    </td>

                </tr>

                </tbody>

                <tfoot th:if="${view.totalPages() > 1}">
                    <tr>
                        <td colspan="5" class="px-5 py-3">
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-muted-foreground">
                                    Page <span th:text="${view.page() + 1}">1</span>
                                    of <span th:text="${view.totalPages()}">1</span>
                                </span>
                                <div class="flex items-center gap-2">
                                    <a th:href="@{/receptionist/stays/stays(search=${view.checkedInSearch()}, page=${view.page() - 1})}"
                                       th:classappend="${view.page() == 0} ? 'pointer-events-none opacity-50' : ''"
                                       class="btn btn-ghost btn-sm">Prev</a>
                                    <input type="number" x-data
                                           @keydown.enter="const p = new URLSearchParams(window.location.search); p.set('page', Math.max(0, (parseInt($event.target.value) || 1) - 1)); window.location.href = '?' + p.toString();"
                                           min="1" th:max="${view.totalPages()}"
                                           class="input w-16 text-center" placeholder="#">
                                    <a th:href="@{/receptionist/stays/stays(search=${view.checkedInSearch()}, page=${view.page() + 1})}"
                                       th:classappend="${view.page() >= view.totalPages() - 1} ? 'pointer-events-none opacity-50' : ''"
                                       class="btn btn-ghost btn-sm">Next</a>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tfoot>

            </table>

        </div>

    </section>

</main>

</body>
</html>
