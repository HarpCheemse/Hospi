<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room Status | Hospi</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>

    <script th:inline="javascript">
        window.csrfToken = /*[[${_csrf.token}]]*/ '';
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.9/cdn.min.js" defer></script>
</head>

<body class="staff-layout">

<!-- SIDEBAR -->
<div th:replace="~{fragments/receptionist-sidebar :: sidebar}"></div>

<!-- MAIN -->
<main class="staff-page"
      x-data="{
          selectedRoom: null,
          occupancy: null,
          loading: false,
          conditionStatus: null,

          async openRoom(id) {
              this.selectedRoom = id;
              this.loading = true;
              try {
                  const res = await fetch('/receptionist/room-status/' + id + '/occupancy');
                  this.occupancy = await res.json();
                  this.conditionStatus = this.occupancy.conditionStatus;
              } catch (e) {
                  this.occupancy = null;
              }
              this.loading = false;
          },

          closeRoom() {
              this.selectedRoom = null;
              this.occupancy = null;
              this.conditionStatus = null;
          },

          async updateCondition() {
              const params = new URLSearchParams();
              params.append('conditionStatus', this.conditionStatus);
              params.append('_csrf', window.csrfToken);
              await fetch('/receptionist/room-status/' + this.selectedRoom + '/condition', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                  body: params
              });
              window.location.reload();
          }
      }">

    <!-- TOASTS -->
    <div th:replace="~{fragments/components/toast :: toast}"></div>

    <!-- HEADER -->
    <div class="staff-page-header">

        <div class="flex items-center gap-4">

            <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-primary/10 text-primary">
                <img th:src="@{/assets/icons/door-open.svg}" alt="">
            </div>

            <div>
                <h1 class="staff-page-title">Room Status</h1>
                <p class="page-description">
                    View real-time room status across all floors.
                </p>
            </div>

        </div>

    </div>

    <!-- EMPTY STATE -->
    <div th:if="${hotel.floorCount == null or hotel.floorCount == 0}"
         class="card-empty">

        <h2 class="text-lg font-semibold">
            No Floors Configured
        </h2>

        <p class="mt-2 text-sm text-muted-foreground">
            Configure your hotel's floor count before creating rooms.
        </p>

    </div>

    <!-- FLOOR FILTER -->
    <div th:if="${hotel.floorCount != null and hotel.floorCount > 0}"
         class="mb-4 flex gap-2">

        <a th:href="@{/receptionist/room-status}"
           th:classappend="${selectedFloor == null} ? 'btn-primary' : 'btn-ghost'"
           class="btn btn-sm">
            All Floors
        </a>

        <a th:each="i : ${#numbers.sequence(1, hotel.floorCount)}"
           th:href="@{/receptionist/room-status(floor=${i})}"
           th:classappend="${selectedFloor == i} ? 'btn-primary' : 'btn-ghost'"
           th:text="|Floor ${i}|"
           class="btn btn-sm">
            Floor 1
        </a>

    </div>

    <!-- FLOORS -->
    <div th:if="${hotel.floorCount != null and hotel.floorCount > 0}"
         class="flex flex-col gap-6">

        <!-- FLOOR -->
        <section th:each="floor : ${floors}"
                 class="card">

            <!-- FLOOR HEADER -->
            <div class="border-b border-border px-6 py-5">

                <div class="flex items-center gap-3">

                    <img th:src="@{/assets/icons/building-2.svg}" class="h-5 w-5 text-primary opacity-80" alt="">

                    <div>
                        <h2 class="text-xl font-semibold"
                            th:text="|Floor ${floor.number}|">
                            Floor 1
                        </h2>

                        <p class="mt-1 text-sm text-muted-foreground"
                           th:text="|${floor.roomCount} rooms|">
                            10 rooms
                        </p>
                    </div>

                </div>

            </div>

            <!-- ROOM GRID -->
            <div class="grid grid-cols-2 gap-4 p-5 md:grid-cols-4 xl:grid-cols-5">

                <!-- ROOM CARD -->
                <div th:each="room : ${floor.rooms}"
                     role="button"
                     tabindex="0"
                     class="group relative cursor-pointer overflow-hidden rounded-2xl border border-border bg-background p-4 text-left shadow-sm transition hover:shadow-md"
                     th:attr="data-room-id=${room.id}"
                     x-on:click="openRoom($el.dataset.roomId)">

                    <!-- ROOM NUMBER -->
                    <div class="flex items-center justify-between pl-2">
                        <div class="text-xl font-bold tracking-tight"
                             th:text="${room.roomNumber}">
                            101
                        </div>
                    </div>

                    <!-- ROOM TYPE -->
                    <div class="mt-0.5 pl-2 text-xs text-muted-foreground"
                         th:text="${room.roomTypeName}">
                        Deluxe King
                    </div>

                    <!-- STATUS ROW -->
                    <div class="mt-3 flex items-center gap-3 pl-2">

                        <!-- OCCUPANCY DOT -->
                        <span class="flex items-center gap-1.5 text-xs font-medium">

                            <span th:classappend="
                                    ${room.occupancyStatus?.name() == 'VACANT'} ? 'bg-success' :
                                    (${room.occupancyStatus?.name() == 'OCCUPIED'} ? 'bg-yellow-500' :
                                    'bg-muted-foreground')"
                                  class="inline-block h-2 w-2 rounded-full">
                            </span>

                            <span th:classappend="
                                    ${room.occupancyStatus?.name() == 'VACANT'} ? 'text-success' :
                                    (${room.occupancyStatus?.name() == 'OCCUPIED'} ? 'text-accent' :
                                    'text-muted-foreground')"
                                  th:text="${room.occupancyStatus}">
                                VACANT
                            </span>

                        </span>

                        <!-- CONDITION DOT -->
                        <span class="flex items-center gap-1.5 text-xs font-medium">

                            <span th:classappend="
                                    ${room.conditionStatus?.name() == 'CLEAN'} ? 'bg-success' :
                                    (${room.conditionStatus?.name() == 'DIRTY'} ? 'bg-warning' :
                                    (${room.conditionStatus?.name() == 'MAINTENANCE'} ? 'bg-danger' :
                                    'bg-muted-foreground'))"
                                  class="inline-block h-2 w-2 rounded-full">
                            </span>

                            <span th:classappend="
                                    ${room.conditionStatus?.name() == 'CLEAN'} ? 'text-success' :
                                    (${room.conditionStatus?.name() == 'DIRTY'} ? 'text-warning' :
                                    (${room.conditionStatus?.name() == 'MAINTENANCE'} ? 'text-danger' :
                                    'text-muted-foreground'))"
                                  th:text="${room.conditionStatus}">
                                CLEAN
                            </span>

                        </span>

                    </div>

                </div>

            </div>

        </section>

    </div>

    <!-- MODAL OVERLAY -->
    <div x-show="selectedRoom"
         x-cloak
         class="fixed inset-0 z-50 flex items-center justify-center">

        <!-- BACKDROP -->
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"
             x-on:click="closeRoom()">
        </div>

        <!-- MODAL CONTENT -->
        <div x-show="selectedRoom"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 scale-100"
             x-transition:leave-end="opacity-0 scale-95"
             x-on:click.stop
             class="relative mx-4 w-full max-w-md rounded-2xl border border-border bg-surface p-6 shadow-2xl">

            <!-- LOADING -->
            <div x-show="loading"
                 class="flex items-center justify-center py-12">
                <span class="text-sm text-muted-foreground">Loading...</span>
            </div>

            <!-- OCCUPANCY DATA -->
            <div x-show="!loading && occupancy"
                 x-cloak>

                <!-- HEADER -->
                <div class="flex items-start justify-between">
                    <div>
                        <h2 class="text-xl font-bold"
                            x-text="'Room ' + occupancy.roomNumber">
                            101
                        </h2>
                        <p class="text-sm text-muted-foreground"
                           x-text="occupancy.roomTypeName || 'No type'">
                            Deluxe King
                        </p>
                    </div>
                    <button x-on:click="closeRoom()"
                            class="text-2xl leading-none text-muted-foreground hover:text-foreground">
                        &times;
                    </button>
                </div>

                <!-- OCCUPANT INFO -->
                <div class="mt-5 rounded-xl bg-gray-50 p-4">

                    <template x-if="occupancy.occupancyStatus === 'OCCUPIED'">
                        <div>
                            <h3 class="mb-3 text-sm font-semibold text-muted-foreground">
                                OCCUPANT
                            </h3>

                            <div class="space-y-2 text-sm">
                                <div class="flex justify-between">
                                    <span class="text-muted-foreground">Guest</span>
                                    <span class="font-medium"
                                          x-text="occupancy.guestName"></span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-muted-foreground">Check-in</span>
                                    <span class="font-medium"
                                          x-text="occupancy.checkInAt"></span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-muted-foreground">Check-out</span>
                                    <span class="font-medium"
                                          x-text="occupancy.checkOutAt"></span>
                                </div>
                            </div>

                            <!-- STAYING GUESTS -->
                            <template x-if="occupancy.stayingGuests && occupancy.stayingGuests.length > 0">
                                <div class="mt-3 border-t border-gray-200 pt-3">
                                    <h4 class="mb-2 text-xs font-semibold text-muted-foreground">
                                        STAYING GUESTS
                                    </h4>
                                    <ul class="space-y-1 text-sm">
                                        <template x-for="guest in occupancy.stayingGuests" :key="guest.name">
                                            <li class="flex justify-between">
                                                <span x-text="guest.name"></span>
                                                <span class="text-xs text-muted-foreground"
                                                      x-text="guest.nationality || ''"></span>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template x-if="occupancy.occupancyStatus === 'VACANT'">
                        <div>
                            <h3 class="text-sm font-semibold text-muted-foreground">
                                STATUS
                            </h3>
                            <p class="mt-1 text-lg font-semibold text-success">
                                Vacant
                            </p>
                        </div>
                    </template>

                </div>

                <!-- CONDITION STATUS UPDATE -->
                <div class="mt-4">
                    <label class="mb-2 block text-sm font-semibold text-muted-foreground">
                        CONDITION STATUS
                    </label>
                    <div class="flex gap-2">
                        <template x-for="status in ['CLEAN', 'DIRTY', 'MAINTENANCE']" :key="status">
                            <button x-on:click="conditionStatus = status"
                                    x-bind:class="{
                                        'bg-success/10 text-success border-success': status === 'CLEAN' && conditionStatus === 'CLEAN',
                                        'bg-warning/10 text-warning border-warning': status === 'DIRTY' && conditionStatus === 'DIRTY',
                                        'bg-danger/10 text-danger border-danger': status === 'MAINTENANCE' && conditionStatus === 'MAINTENANCE',
                                        'border-border text-muted-foreground': conditionStatus !== status
                                    }"
                                    class="flex-1 rounded-lg border px-3 py-2 text-center text-xs font-medium transition hover:opacity-80"
                                    x-text="status">
                                CLEAN
                            </button>
                        </template>
                    </div>
                </div>

                <!-- SAVE BUTTON -->
                <div class="mt-5 flex justify-end gap-3">
                    <button x-on:click="closeRoom()"
                            class="btn btn-ghost">
                        Cancel
                    </button>
                    <button x-on:click="updateCondition()"
                            class="btn btn-primary">
                        Save
                    </button>
                </div>

            </div>
        </div>
    </div>

</main>

</body>
</html>
