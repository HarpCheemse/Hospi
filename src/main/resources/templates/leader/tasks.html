<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaning Tasks | Hospi</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <style>
        [x-cloak] { display: none !important; }
    </style>

    <script th:inline="javascript">
        window.csrfToken = /*[[${_csrf.token}]]*/ '';
        window.csrfHeader = /*[[${_csrf.headerName}]]*/ '';
    </script>

    <script src="/js/alpine.min.js" defer></script>
</head>

<body class="staff-layout">

<div th:replace="~{fragments/leader-sidebar :: sidebar}"></div>

<main class="staff-page">

    <div th:replace="~{fragments/components/toast :: toast}"></div>

    <!-- HEADER -->
    <header class="staff-page-header">
        <div class="flex items-center gap-4">
            <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-primary/10 text-primary">
                <img th:src="@{/assets/icons/list-todo.svg}" class="h-7 w-7" alt="">
            </div>
            <section>
                <h1 class="staff-page-title">Cleaning Tasks</h1>
                <p class="page-description">Manage and complete housekeeping tasks for dirty rooms</p>
            </section>
        </div>
    </header>

    <!-- CONTAINER -->
    <div class="mt-6"
         th:attr="data-total=${totalRooms}, data-clean=${cleanRooms}"
         x-data="{
             confirmOpen: false,
             selectedRoomId: null,
             selectedRoomNum: null,
             cleanedRoomIds: [],
             total: parseInt($el.dataset.total),
             clean: parseInt($el.dataset.clean),
         }">

        <!-- EMPTY STATE -->
        <div class="p-12 text-center text-muted-foreground"
             th:if="${#maps.isEmpty(roomsByFloor)}">
            <div class="flex justify-center mb-4">
                <img th:src="@{/assets/icons/clipboard-check.svg}" class="h-16 w-16 opacity-40" alt="">
            </div>
            <p class="text-lg font-medium text-foreground">All tasks completed!</p>
            <p class="text-sm mt-1">No dirty rooms remaining.</p>
        </div>

        <!-- TASK LIST BY FLOOR -->
        <div th:if="${!#maps.isEmpty(roomsByFloor)}" class="flex flex-col gap-6">

            <div th:each="floorEntry : ${roomsByFloor}">
                <!-- FLOOR HEADER -->
                <div class="mb-3 flex items-center gap-3">
                    <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary/10 text-primary">
                        <img th:src="@{/assets/icons/building-2.svg}" class="h-4 w-4" alt="">
                    </div>
                    <h2 class="text-base font-semibold text-foreground" th:text="'Floor ' + ${floorEntry.key}">Floor 1</h2>
                    <span class="text-xs text-muted-foreground" th:text="|${floorEntry.value.size()} room(s)|">0 rooms</span>
                </div>

                <!-- ROOMS ON THIS FLOOR -->
                <div class="flex flex-col gap-2">
                    <div th:each="room : ${floorEntry.value}"
                         th:attr="data-room-id=${room.id}, data-room-num=${room.roomNumber}"
                         x-data="{ roomId: parseInt($el.dataset.roomId), roomNum: $el.dataset.roomNum }"
                         x-show="!cleanedRoomIds.includes(roomId)"
                         class="grid grid-cols-12 items-center gap-3 rounded-lg border border-border bg-background p-4 text-sm shadow-sm">

                        <div class="col-span-3">
                            <p class="font-bold text-foreground text-base" th:text="'Room ' + ${room.roomNumber}">Room 101</p>
                            <p class="text-xs text-muted-foreground" th:text="${room.roomType?.name}">Standard Room</p>
                        </div>

                        <div class="col-span-2 text-muted-foreground">
                            <span class="font-medium">Floor: </span><span th:text="${room.floorNumber}">1</span>
                        </div>

                        <div class="col-span-2">
                            <span th:if="${room.occupancyStatus.name() == 'OCCUPIED'}" class="pill-danger">Occupied</span>
                            <span th:if="${room.occupancyStatus.name() == 'VACANT'}" class="pill-muted">Vacant</span>
                        </div>

                        <div class="col-span-2">
                            <span class="pill-warning">Dirty</span>
                        </div>

                        <div class="col-span-3 flex justify-end">
                            <button class="btn btn-success"
                                    @click="selectedRoomId = roomId; selectedRoomNum = roomNum; confirmOpen = true">
                                Mark Done
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- CONFIRMATION MODAL -->
        <div x-show="confirmOpen" x-cloak class="fixed inset-0 z-50 flex items-center justify-center">
            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="confirmOpen = false"></div>
            <div x-show="confirmOpen"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-95"
                 class="relative mx-4 w-full max-w-md rounded-2xl border border-border bg-surface p-6 shadow-2xl">

                <h3 class="text-lg font-semibold text-foreground">Confirm Room Cleaned</h3>
                <p class="mt-2 text-sm text-muted-foreground">
                    Are you sure you want to mark <strong x-text="'Room ' + selectedRoomNum"></strong> as clean?
                </p>

                <div class="mt-6 flex justify-end gap-3">
                    <button @click="confirmOpen = false" class="btn btn-ghost">Cancel</button>
                    <button @click="
                        fetch('/leader/rooms/' + selectedRoomId + '/clean', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/x-www-form-urlencoded',
                                [window.csrfHeader || 'X-CSRF-TOKEN']: window.csrfToken
                            }
                        }).then(response => {
                            if (response.ok) {
                                cleanedRoomIds.push(selectedRoomId);
                                confirmOpen = false;
                            } else {
                                alert('Error completing task for Room ' + selectedRoomNum);
                            }
                        }).catch(() => {
                            alert('Error completing task for Room ' + selectedRoomNum);
                        });
                    " class="btn btn-success">Yes, Mark Clean</button>
                </div>
            </div>
        </div>
    </div>

</main>

</body>
</html>
