<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account Management | Hospi</title>

    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="bg-background text-text">

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

    <!-- MAIN -->
    <main class="flex-1 p-6">

        <!-- TOAST -->
        <div th:replace="~{fragments/components/toast :: toast}"></div>

        <!-- HEADER -->
        <div class="mb-6 flex items-start justify-between">

            <div>

                <h1 class="text-2xl font-bold">
                    Account Management
                </h1>

                <p class="mt-1 text-sm text-muted">
                    Review and manage user accounts across the system.
                </p>

            </div>

            <a th:href="@{/admin/accounts/create}"
               class="rounded-xl bg-primary px-5 py-3 text-sm font-medium text-white hover:opacity-90">
                Create Account
            </a>

        </div>

        <!-- FILTERS -->
        <section class="mb-6 rounded-2xl border border-border bg-surface shadow-card">

            <div class="border-b border-border p-5">

                <h2 class="text-lg font-semibold">
                    Search & Filters
                </h2>

            </div>

            <div class="grid grid-cols-3 gap-5 p-5">

                <div>

                    <label class="mb-2 block text-sm text-muted">
                        Search
                    </label>

                    <input type="text"
                           placeholder="Search by name or email..."
                           class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary">

                </div>

                <div>

                    <label class="mb-2 block text-sm text-muted">
                        Role
                    </label>

                    <select
                            class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary">

                        <option>All Roles</option>
                        <option>Admin</option>
                        <option>Manager</option>
                        <option>Receptionist</option>
                        <option>Housekeeper</option>
                        <option>Accountant</option>
                        <option>Customer</option>

                    </select>

                </div>

                <div>

                    <label class="mb-2 block text-sm text-muted">
                        Status
                    </label>

                    <select
                            class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary">

                        <option>All Statuses</option>
                        <option>Active</option>
                        <option>Disabled</option>
                        <option>Locked</option>

                    </select>

                </div>

            </div>

        </section>

        <!-- ACCOUNTS -->
        <section class="rounded-2xl border border-border bg-surface shadow-card">

            <div class="border-b border-border p-5">

                <h2 class="text-lg font-semibold">
                    Accounts
                </h2>

            </div>

            <div class="overflow-x-auto">

                <table class="w-full">

                    <thead class="bg-surface-muted">

                    <tr>

                        <th class="px-5 py-4 text-left text-sm font-medium text-muted">
                            Account
                        </th>

                        <th class="px-5 py-4 text-left text-sm font-medium text-muted">
                            Role
                        </th>

                        <th class="px-5 py-4 text-left text-sm font-medium text-muted">
                            Status
                        </th>

                        <th class="px-5 py-4 text-right text-sm font-medium text-muted">
                            Actions
                        </th>

                    </tr>

                    </thead>

                    <tbody>
                    <tbody>

                    <tr th:each="account : ${accounts}"
                        class="border-t border-border">

                        <td class="px-5 py-4">

                            <p class="font-medium"
                               th:text="${account.fullName()}">
                                John Smith
                            </p>

                            <p class="text-sm text-muted"
                               th:text="${account.email()}">
                                john@hospi.com
                            </p>

                        </td>

                        <td class="px-5 py-4"
                            th:text="${account.role()}">
                            MANAGER
                        </td>

                        <td class="px-5 py-4">

        <span th:if="${account.status().name() == 'ACTIVE'}"
              class="rounded-full bg-primary-soft px-2 py-1 text-xs font-medium text-primary-dark"
              th:text="${account.status()}">
            ACTIVE
        </span>

                            <span th:if="${account.status().name() == 'DISABLED'}"
                                  class="rounded-full bg-danger/10 px-2 py-1 text-xs font-medium text-danger"
                                  th:text="${account.status()}">
            DISABLED
        </span>

                            <span th:if="${account.status().name() == 'LOCKED'}"
                                  class="rounded-full bg-warning/10 px-2 py-1 text-xs font-medium text-warning"
                                  th:text="${account.status()}">
            LOCKED
        </span>

                        </td>

                        <td class="px-5 py-4 text-right">

                            <a th:href="@{/admin/accounts/{id}(id=${account.id()})}"
                               class="rounded-xl border border-border px-4 py-2 text-sm font-medium hover:bg-background">
                                View
                            </a>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(accounts)}">

                        <td colspan="4"
                            class="px-5 py-10 text-center text-muted">
                            No accounts found.
                        </td>

                    </tr>

                    </tbody>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

</body>
</html>
