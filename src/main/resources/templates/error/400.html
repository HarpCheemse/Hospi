<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 Bad Request | Hospi</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="flex min-h-screen items-center justify-center bg-background">

<section class="mx-auto w-full max-w-md px-4">

    <div class="card p-10 text-center">

        <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-warning/10">
            <svg class="h-8 w-8 text-warning"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 viewBox="0 0 24 24"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        </div>

        <h1 class="text-5xl font-bold text-foreground">
            400
        </h1>

        <p class="mt-2 text-lg font-semibold text-foreground">
            Bad Request
        </p>

        <p class="mt-2 text-sm text-muted-foreground">
            We couldn't process your request because some required
            information was missing or invalid.
        </p>

        <p class="mt-4 text-xs text-muted-foreground">
            Please check your information and try again.
            If you followed a link to reach this page, it may be incomplete or expired.
        </p>

        <div class="mt-8 flex items-center justify-center gap-3">

            <button onclick="history.back()"
                    class="btn btn-secondary">
                Go Back
            </button>

            <a href="/"
               class="btn btn-primary">
                Back to Home
            </a>

        </div>

    </div>

</section>
</body>
</html>
