<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Layout Fragments</title>
</head>
<body>

<!-- HEADER FRAGMENT -->
<header th:fragment="header(activePage)" class="fixed top-0 left-0 z-50 w-full bg-background/80 backdrop-blur-md border-b border-border/30">
  <div class="mx-auto max-w-7xl px-6 py-4">
    <div class="flex items-center justify-between rounded-2xl bg-surface px-5 py-3 shadow-card">

      <a th:href="@{/}" class="flex items-center gap-3">
        <span class="text-lg font-bold text-primary tracking-wider font-display">HOSPI</span>
      </a>

      <nav class="hidden items-center gap-8 text-sm font-medium md:flex">
        <a class="transition-colors hover:text-primary" 
           th:classappend="${activePage == 'home'} ? 'text-primary font-semibold' : 'text-muted-foreground'" 
           th:href="@{/}">Home</a>
        <a class="transition-colors hover:text-primary" 
           th:classappend="${activePage == 'rooms'} ? 'text-primary font-semibold' : 'text-muted-foreground'" 
           th:href="@{/rooms}">Rooms</a>
        <a class="transition-colors hover:text-primary" 
           th:classappend="${activePage == 'policies'} ? 'text-primary font-semibold' : 'text-muted-foreground'" 
           th:href="@{/policies}">Policies</a>
        <a class="transition-colors hover:text-primary" 
           th:classappend="${activePage == 'contact'} ? 'text-primary font-semibold' : 'text-muted-foreground'" 
           th:href="@{/contact}">Contact</a>
        <a class="transition-colors hover:text-primary" 
           th:classappend="${activePage == 'my-booking'} ? 'text-primary font-semibold' : 'text-muted-foreground'" 
           th:href="@{/my-booking}">My Booking</a>
      </nav>

      <a class="rounded-full bg-primary px-5 py-2.5 text-sm font-semibold text-white shadow-card hover:opacity-90 transition-opacity"
         th:href="@{/book}">
        Book Now
      </a>

    </div>
  </div>
</header>

<!-- FOOTER FRAGMENT -->
<footer th:fragment="footer" class="border-t border-border bg-surface py-12 mt-auto">
  <div class="mx-auto max-w-7xl px-6">
    <div class="grid gap-8 md:grid-cols-2 lg:grid-cols-3">
      <div>
        <p class="text-lg font-bold text-primary font-display" th:text="${hotel != null ? hotel.name : 'Hospi'}">Hospi</p>
        <p class="mt-3 text-sm text-muted-foreground leading-relaxed" th:text="${hotel != null ? hotel.description : 'Hotel booking and management system.'}">
          Hotel description...
        </p>
      </div>
      <div>
        <h4 class="text-sm font-bold text-text uppercase tracking-wider mb-3">Quick Navigation</h4>
        <div class="flex flex-col gap-2 text-sm text-muted-foreground">
          <a class="hover:text-primary transition-colors" th:href="@{/}">Home</a>
          <a class="hover:text-primary transition-colors" th:href="@{/rooms}">Rooms</a>
          <a class="hover:text-primary transition-colors" th:href="@{/policies}">Policies</a>
          <a class="hover:text-primary transition-colors" th:href="@{/contact}">Contact</a>
          <a class="hover:text-primary transition-colors" th:href="@{/my-booking}">My Booking</a>
        </div>
      </div>
      <div>
        <h4 class="text-sm font-bold text-text uppercase tracking-wider mb-3">Contact Details</h4>
        <div class="flex flex-col gap-2 text-sm text-muted-foreground">
          <p th:if="${hotel != null and hotel.address != null}" class="flex items-center gap-2">
            <svg class="size-4 shrink-0 text-text" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
            <span th:text="${hotel.address}">Address</span>
          </p>
          <p th:if="${hotel != null and hotel.phone != null}" class="flex items-center gap-2">
            <svg class="size-4 shrink-0 text-text" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/></svg>
            <span th:text="${hotel.phone}">Phone</span>
          </p>
          <p th:if="${hotel != null and hotel.email != null}" class="flex items-center gap-2 truncate">
            <svg class="size-4 shrink-0 text-text" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
            <span th:text="${hotel.email}">Email</span>
          </p>
        </div>
      </div>
    </div>
    <div class="mt-8 pt-8 border-t border-border/40 text-center text-xs text-subtle">
      &copy; 2026 Hospi Hotel. All rights reserved.
    </div>
  </div>
</footer>

</body>
</html>
