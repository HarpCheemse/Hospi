<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Layout Fragments</title>
</head>
<body>

<!-- HEADER FRAGMENT -->
<header th:fragment="header(activePage)"
        class="fixed top-0 left-0 z-sticky w-full bg-background/80 backdrop-blur-md border-b border-border/30">
    <div class="mx-auto max-w-[72rem] px-6 py-4">
        <div class="flex items-center justify-between rounded-2xl bg-surface px-5 py-3 shadow-card">

            <a th:href="@{/}" class="flex items-center gap-3">
                <span class="text-lg font-bold text-primary tracking-wider font-display">HOSPI</span>
            </a>

            <nav class="hidden items-center gap-8 text-sm font-medium md:flex">
                <a class="transition duration-base ease-standard hover:text-primary"
                   th:classappend="${activePage == 'home'} ? 'text-primary font-semibold' : 'text-muted-foreground'"
                   th:href="@{/}">Home</a>
                <a class="transition duration-base ease-standard hover:text-primary"
                   th:classappend="${activePage == 'rooms'} ? 'text-primary font-semibold' : 'text-muted-foreground'"
                   th:href="@{/rooms}">Rooms</a>
                <a class="transition duration-base ease-standard hover:text-primary"
                   th:classappend="${activePage == 'policies'} ? 'text-primary font-semibold' : 'text-muted-foreground'"
                   th:href="@{/policies}">Policies</a>
                <a class="transition duration-base ease-standard hover:text-primary"
                   th:classappend="${activePage == 'contact'} ? 'text-primary font-semibold' : 'text-muted-foreground'"
                   th:href="@{/contact}">Contact</a>
                <a class="transition duration-base ease-standard hover:text-primary"
                   th:classappend="${activePage == 'my-booking'} ? 'text-primary font-semibold' : 'text-muted-foreground'"
                   th:href="@{/my-booking}">My Booking</a>
            </nav>

            <a class="btn btn-primary btn-sm"
               th:href="@{/#booking}">
                Book Now
            </a>

        </div>
    </div>
</header>

<!-- FOOTER FRAGMENT -->
<footer th:fragment="footer" class="border-t border-border bg-surface py-12 mt-auto">
    <div class="mx-auto max-w-[72rem] px-6">
        <div class="grid gap-8 md:grid-cols-2 lg:grid-cols-3">
            <div>
                <p class="text-lg font-bold text-primary font-display"
                   th:text="${hotel != null ? hotel.name : 'Hospi'}">Hospi</p>
                <p class="mt-3 text-sm text-muted-foreground leading-relaxed"
                   th:text="${hotel != null ? hotel.description : 'Hotel booking and management system.'}">
                    Hotel description...
                </p>
            </div>
            <div>
                <h4 class="text-sm font-bold text-foreground uppercase tracking-brand mb-3">Quick Navigation</h4>
                <div class="flex flex-col gap-2 text-sm text-muted-foreground">
                    <a class="hover:text-primary transition duration-base ease-standard" th:href="@{/}">Home</a>
                    <a class="hover:text-primary transition duration-base ease-standard" th:href="@{/rooms}">Rooms</a>
                    <a class="hover:text-primary transition duration-base ease-standard"
                       th:href="@{/policies}">Policies</a>
                    <a class="hover:text-primary transition duration-base ease-standard"
                       th:href="@{/contact}">Contact</a>
                    <a class="hover:text-primary transition duration-base ease-standard" th:href="@{/my-booking}">My
                        Booking</a>
                </div>
            </div>
            <div>
                <h4 class="text-sm font-bold text-foreground uppercase tracking-brand mb-3">Contact Details</h4>
                <div class="flex flex-col gap-3 text-sm text-muted-foreground">
                    <div th:if="${hotel != null and hotel.address != null}" class="flex items-start gap-2">
                        <img th:src="@{/assets/icons/map-pin.svg}" class="w-4 h-4 mt-0.5 shrink-0 opacity-75" alt="Address">
                        <span th:text="${hotel.address}">Address</span>
                    </div>
                    <div th:if="${hotel != null and hotel.phone != null}" class="flex items-center gap-2">
                        <img th:src="@{/assets/icons/phone.svg}" class="w-4 h-4 shrink-0 opacity-75" alt="Phone">
                        <span th:text="${hotel.phone}">Phone</span>
                    </div>
                    <div th:if="${hotel != null and hotel.email != null}" class="flex items-center gap-2">
                        <img th:src="@{/assets/icons/mail.svg}" class="w-4 h-4 shrink-0 opacity-75" alt="Email">
                        <span th:text="${hotel.email}">Email</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-8 pt-8 border-t border-border/40 text-center text-xs text-muted-foreground/60">
            &copy; 2026 Hospi Hotel. All rights reserved.
        </div>
    </div>
</footer>

</body>
</html>
