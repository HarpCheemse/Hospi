<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Stay | Hospi Hotel</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-background text-text flex flex-col min-h-screen pt-24">

  <div th:replace="~{guest/layout :: header('book')}"></div>

  <main class="flex-grow">

    <section class="bg-surface-muted py-16 border-b border-border/30">
      <div class="mx-auto max-w-7xl px-6 text-center">
        <p class="text-xs font-semibold uppercase tracking-widest text-accent mb-2 font-sans">BOOK YOUR STAY</p>
        <h1 class="text-4xl md:text-5xl font-bold font-display text-text">Select Your Dates</h1>
        <p class="mt-4 max-w-xl mx-auto text-sm text-muted">Choose your check-in and check-out dates to see available rooms.</p>
      </div>
    </section>

    <section class="mx-auto max-w-2xl px-6 py-20">
      <div class="rounded-2xl bg-surface border border-border/80 shadow-card p-8">

        <form th:action="@{/book}" th:object="${form}" method="post" class="flex flex-col gap-6">

          <div class="grid grid-cols-2 gap-5">
            <div>
              <label class="mb-2 block text-sm font-medium text-foreground" for="checkInAt">
                Check-In Date
              </label>
              <input type="date" id="checkInAt" th:field="*{checkInAt}"
                     class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary"
                     required>
              <p th:if="${#fields.hasErrors('checkInAt')}"
                 class="mt-1 text-xs text-danger"
                 th:errors="*{checkInAt}">Error</p>
            </div>

            <div>
              <label class="mb-2 block text-sm font-medium text-foreground" for="checkOutAt">
                Check-Out Date
              </label>
              <input type="date" id="checkOutAt" th:field="*{checkOutAt}"
                     class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary"
                     required>
              <p th:if="${#fields.hasErrors('checkOutAt')}"
                 class="mt-1 text-xs text-danger"
                 th:errors="*{checkOutAt}">Error</p>
            </div>
          </div>

          <button type="submit"
                  class="w-full rounded-xl bg-primary px-6 py-3.5 text-sm font-semibold text-white shadow-card hover:opacity-90 transition-opacity">
            Check Availability
          </button>

        </form>

      </div>
    </section>

  </main>

  <div th:replace="~{guest/layout :: footer}"></div>

</body>
</html>
