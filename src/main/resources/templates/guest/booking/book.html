<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Stay | Hospi Hotel</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="/js/alpine.min.js" defer></script>
</head>
<body class="bg-background text-text flex flex-col min-h-screen pt-24">

  <div th:replace="~{guest/layout :: header('book')}"></div>

  <main class="flex-grow">

    <div th:replace="~{fragments/components/toast :: toast}"></div>

    <section class="bg-surface-muted py-16 border-b border-border/30">
      <div class="mx-auto max-w-7xl px-6 text-center">
        <p class="text-xs font-semibold uppercase tracking-widest text-accent mb-2 font-sans">STEP 1 OF 5</p>
        <div class="flex items-center justify-center gap-4 mb-4">
          <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-primary/10 text-primary">
            <img th:src="@{/assets/icons/calendar-days.svg}" alt="">
          </div>
          <div class="text-left">
            <h1 class="text-4xl md:text-5xl font-bold font-display text-text">Select Your Dates</h1>
            <p class="mt-1 text-sm text-muted-foreground">Choose your check-in and check-out dates to see available rooms.</p>
          </div>
        </div>
      </div>
    </section>

    <section class="mx-auto max-w-2xl px-6 py-20">
      <form th:action="@{/book}" th:object="${form}" method="post" class="flex flex-col gap-6" novalidate>

        <section class="card">
          <div class="border-b border-border px-6 py-5">
            <div class="flex items-center gap-3">
              <img th:src="@{/assets/icons/calendar-days.svg}" class="h-5 w-5 text-primary opacity-80" alt="">
              <div>
                <h2 class="text-xl font-semibold">Stay Dates</h2>
                <p class="mt-1 text-sm text-muted-foreground">Select your check-in and check-out dates.</p>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-5 p-6">
            <div class="flex flex-col gap-2">
              <label class="text-sm font-medium" for="checkInAt">Check-In Date <span class="text-danger">*</span></label>
              <div th:replace="~{fragments/form-error :: error('checkInAt')}"></div>
              <input type="date" id="checkInAt" th:field="*{checkInAt}"
                     class="input"
                     th:classappend="${#fields.hasErrors('checkInAt')} ? 'input-error' : ''"
                     required>
            </div>

            <div class="flex flex-col gap-2">
              <label class="text-sm font-medium" for="checkOutAt">Check-Out Date <span class="text-danger">*</span></label>
              <div th:replace="~{fragments/form-error :: error('checkOutAt')}"></div>
              <input type="date" id="checkOutAt" th:field="*{checkOutAt}"
                     class="input"
                     th:classappend="${#fields.hasErrors('checkOutAt')} ? 'input-error' : ''"
                     required>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="flex items-center justify-end gap-3 p-5">
            <button type="submit" class="btn btn-primary btn-lg">
              Check Availability
            </button>
          </div>
        </section>

      </form>
    </section>

  </main>

  <div th:replace="~{guest/layout :: footer}"></div>

</body>
</html>
