<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Details | Hospi Hotel</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-background text-text flex flex-col min-h-screen pt-24">

  <div th:replace="~{guest/layout :: header('book')}"></div>

  <main class="flex-grow">

    <div th:replace="~{fragments/components/toast :: toast}"></div>

    <section class="bg-surface-muted py-16 border-b border-border/30">
      <div class="mx-auto max-w-7xl px-6 text-center">
        <p class="text-xs font-semibold uppercase tracking-widest text-accent mb-2 font-sans">STEP 3 OF 5</p>
        <div class="flex items-center justify-center gap-4 mb-4">
          <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-primary/10 text-primary">
            <img th:src="@{/assets/icons/users.svg}" alt="">
          </div>
          <div class="text-left">
            <h1 class="text-4xl md:text-5xl font-bold font-display text-text">Guest Details &amp; Verification</h1>
            <p class="mt-1 text-sm text-muted-foreground-foreground">Enter your details and verify your email to continue.</p>
          </div>
        </div>
      </div>
    </section>

    <section class="mx-auto max-w-2xl px-6 py-20">

      <!-- Guest Details Form -->
      <section class="card">

        <div class="border-b border-border px-6 py-5">
          <div class="flex items-center gap-3">
            <img th:src="@{/assets/icons/users.svg}" class="h-5 w-5 text-primary opacity-80" alt="">
            <div>
              <h2 class="text-xl font-semibold">Your Information</h2>
              <p class="mt-1 text-sm text-muted-foreground-foreground">Enter your personal details.</p>
            </div>
          </div>
        </div>

        <form th:action="@{/book/verify/send-otp}" th:object="${guestDetailForm}" method="post" class="flex flex-col gap-5 p-6" novalidate>

          <div th:if="${#fields.hasGlobalErrors()}"
               class="rounded-xl border border-danger bg-red-50 px-4 py-3 text-sm text-danger">
            <p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p>
          </div>

          <div class="grid grid-cols-2 gap-5">
            <div class="flex flex-col gap-2">
              <label class="text-sm font-medium" for="guestName">Full Name <span class="text-danger">*</span></label>
              <div th:replace="fragments/form-error :: error('guestName')"></div>
              <input type="text" id="guestName" th:field="*{guestName}"
                     class="input"
                     th:classappend="${#fields.hasErrors('guestName')} ? 'input-error' : ''"
                     required>
            </div>

            <div class="flex flex-col gap-2">
              <label class="text-sm font-medium" for="guestEmail">Email <span class="text-danger">*</span></label>
              <div th:replace="fragments/form-error :: error('guestEmail')"></div>
              <input type="email" id="guestEmail" th:field="*{guestEmail}"
                     class="input"
                     th:classappend="${#fields.hasErrors('guestEmail')} ? 'input-error' : ''"
                     required>
            </div>

            <div class="flex flex-col gap-2">
              <label class="text-sm font-medium" for="guestPhone">Phone <span class="text-danger">*</span></label>
              <div th:replace="fragments/form-error :: error('guestPhone')"></div>
              <input type="tel" id="guestPhone" th:field="*{guestPhone}"
                     class="input"
                     th:classappend="${#fields.hasErrors('guestPhone')} ? 'input-error' : ''"
                     required>
            </div>

            <div class="flex flex-col gap-2">
              <label class="text-sm font-medium" for="guestDateOfBirth">Date of Birth <span class="text-danger">*</span></label>
              <div th:replace="fragments/form-error :: error('guestDateOfBirth')"></div>
              <input type="date" id="guestDateOfBirth" th:field="*{guestDateOfBirth}"
                     class="input"
                     th:classappend="${#fields.hasErrors('guestDateOfBirth')} ? 'input-error' : ''"
                     required>
            </div>
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-medium" for="guestNationality">Nationality</label>
            <div th:replace="fragments/form-error :: error('guestNationality')"></div>
            <input type="text" id="guestNationality" th:field="*{guestNationality}"
                   class="input">
          </div>

          <div class="flex items-center justify-end gap-3 pt-2">
            <button type="submit" class="btn btn-primary btn-lg">
              Send OTP Code
            </button>
          </div>
        </form>

      </section>

      <!-- OTP Verification (shown after OTP is sent) -->
      <section th:if="${otpSent}" class="card mt-6">

        <div class="border-b border-border px-6 py-5">
          <div class="flex items-center gap-3">
            <img th:src="@{/assets/icons/shield-check.svg}" class="h-5 w-5 text-primary opacity-80" alt="">
            <div>
              <h2 class="text-xl font-semibold">Verify Your Email</h2>
              <p class="mt-1 text-sm text-muted-foreground-foreground">Enter the 6-digit code sent to your email.</p>
            </div>
          </div>
        </div>

        <form th:action="@{/book/verify}" th:object="${otpForm}" method="post" class="flex flex-col gap-5 p-6" novalidate>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-medium" for="otp">OTP Code <span class="text-danger">*</span></label>
            <div th:replace="fragments/form-error :: error('otp')"></div>
            <input type="text" id="otp" th:field="*{otp}"
                   placeholder="000000"
                   maxlength="6"
                   inputmode="numeric"
                   pattern="[0-9]{6}"
                   class="input text-center text-2xl tracking-widest"
                   th:classappend="${#fields.hasErrors('otp')} ? 'input-error' : ''"
                   required>
          </div>

          <div class="flex items-center justify-end gap-3 pt-2">
            <button type="submit" class="btn btn-primary btn-lg">
              Verify &amp; Continue
            </button>
          </div>
        </form>

        <div class="px-6 pb-6">
          <p class="text-center text-xs text-muted-foreground">
            Didn't receive the code?
            <a th:href="@{/book/verify}" class="text-primary hover:underline">Resend OTP</a>
          </p>
        </div>

      </section>

    </section>

  </main>

  <div th:replace="~{guest/layout :: footer}"></div>

</body>
</html>
