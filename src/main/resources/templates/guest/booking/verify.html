<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Details | Hospi Hotel</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-background text-text flex flex-col min-h-screen pt-24">

  <div th:replace="~{guest/layout :: header('book')}"></div>

  <main class="flex-grow">

    <div th:replace="~{fragments/components/toast :: toast}"></div>

    <section class="bg-surface-muted py-16 border-b border-border/30">
      <div class="mx-auto max-w-7xl px-6 text-center">
        <p class="text-xs font-semibold uppercase tracking-widest text-accent mb-2 font-sans">STEP 3 OF 5</p>
        <h1 class="text-4xl md:text-5xl font-bold font-display text-text">Guest Details &amp; Verification</h1>
        <p class="mt-4 max-w-xl mx-auto text-sm text-muted">Enter your details and verify your email to continue.</p>
      </div>
    </section>

    <section class="mx-auto max-w-2xl px-6 py-20">

      <!-- Guest Details Form -->
      <div class="rounded-2xl bg-surface border border-border/80 shadow-card p-8">

        <h2 class="text-xl font-bold font-display text-text mb-6">Your Information</h2>

        <form th:action="@{/book/verify/send-otp}" th:object="${guestDetailForm}" method="post" class="flex flex-col gap-5">

          <div class="grid grid-cols-2 gap-5">
            <div>
              <label class="mb-2 block text-sm font-medium text-foreground" for="guestName">
                Full Name <span class="text-danger">*</span>
              </label>
              <input type="text" id="guestName" th:field="*{guestName}"
                     class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary"
                     required>
              <p th:if="${#fields.hasErrors('guestName')}" class="mt-1 text-xs text-danger" th:errors="*{guestName}">Error</p>
            </div>

            <div>
              <label class="mb-2 block text-sm font-medium text-foreground" for="guestEmail">
                Email <span class="text-danger">*</span>
              </label>
              <input type="email" id="guestEmail" th:field="*{guestEmail}"
                     class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary"
                     required>
              <p th:if="${#fields.hasErrors('guestEmail')}" class="mt-1 text-xs text-danger" th:errors="*{guestEmail}">Error</p>
            </div>

            <div>
              <label class="mb-2 block text-sm font-medium text-foreground" for="guestPhone">
                Phone <span class="text-danger">*</span>
              </label>
              <input type="tel" id="guestPhone" th:field="*{guestPhone}"
                     class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary"
                     required>
              <p th:if="${#fields.hasErrors('guestPhone')}" class="mt-1 text-xs text-danger" th:errors="*{guestPhone}">Error</p>
            </div>

            <div>
              <label class="mb-2 block text-sm font-medium text-foreground" for="guestDateOfBirth">
                Date of Birth <span class="text-danger">*</span>
              </label>
              <input type="date" id="guestDateOfBirth" th:field="*{guestDateOfBirth}"
                     class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary"
                     required>
              <p th:if="${#fields.hasErrors('guestDateOfBirth')}" class="mt-1 text-xs text-danger" th:errors="*{guestDateOfBirth}">Error</p>
            </div>
          </div>

          <div>
            <label class="mb-2 block text-sm font-medium text-foreground" for="guestNationality">
              Nationality
            </label>
            <input type="text" id="guestNationality" th:field="*{guestNationality}"
                   class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary">
          </div>

          <button type="submit"
                  class="w-full rounded-xl bg-primary px-6 py-3.5 text-sm font-semibold text-white shadow-card hover:opacity-90 transition-opacity">
            Send OTP Code
          </button>
        </form>

      </div>

      <!-- OTP Verification (shown after OTP is sent) -->
      <div th:if="${otpSent}" class="mt-6 rounded-2xl bg-surface border border-border/80 shadow-card p-8">

        <h2 class="text-xl font-bold font-display text-text mb-2">Verify Your Email</h2>
        <p class="text-sm text-muted mb-6">Enter the 6-digit code sent to your email.</p>

        <form th:action="@{/book/verify}" th:object="${otpForm}" method="post" class="flex flex-col gap-5">

          <div>
            <label class="mb-2 block text-sm font-medium text-foreground" for="otp">
              OTP Code
            </label>
            <input type="text" id="otp" th:field="*{otp}"
                   placeholder="000000"
                   maxlength="6"
                   inputmode="numeric"
                   pattern="[0-9]{6}"
                   class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary text-center text-2xl tracking-widest"
                   required>
            <p th:if="${#fields.hasErrors('otp')}" class="mt-1 text-xs text-danger" th:errors="*{otp}">Error</p>
          </div>

          <button type="submit"
                  class="w-full rounded-xl bg-primary px-6 py-3.5 text-sm font-semibold text-white shadow-card hover:opacity-90 transition-opacity">
            Verify &amp; Continue
          </button>
        </form>

        <p class="mt-4 text-center text-xs text-muted">
          Didn't receive the code?
          <a th:href="@{/book/verify}" class="text-primary hover:underline">Resend OTP</a>
        </p>

      </div>

    </section>

  </main>

  <div th:replace="~{guest/layout :: footer}"></div>

</body>
</html>
