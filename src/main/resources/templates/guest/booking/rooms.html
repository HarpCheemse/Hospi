<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Rooms | Hospi Hotel</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap"
          rel="stylesheet">
</head>
<body class="bg-background text-text flex flex-col min-h-screen pt-24">

<div th:replace="~{guest/layout :: header('book')}"></div>

<main class="flex-grow">

    <section class="bg-surface-muted py-16 border-b border-border/30">
        <div class="mx-auto max-w-7xl px-6 text-center">
            <p class="text-xs font-semibold uppercase tracking-widest text-accent mb-2 font-sans">STEP 2 OF 5</p>
            <h1 class="text-4xl md:text-5xl font-bold font-display text-text">Choose Your Rooms</h1>
            <p class="mt-4 max-w-xl mx-auto text-sm text-muted">
                Select the rooms you'd like for <strong th:text="${draft.checkInAt}">check-in</strong> to <strong
                    th:text="${draft.checkOutAt}">check-out</strong>.
            </p>
        </div>
    </section>

    <section class="mx-auto max-w-5xl px-6 py-20">

        <div th:if="${#lists.isEmpty(availability)}"
             class="text-center py-20 bg-surface rounded-2xl border border-border shadow-card">
            <p class="text-lg text-muted">No rooms available for the selected dates. Please try different dates.</p>
            <a th:href="@{/book}"
               class="mt-4 inline-block rounded-xl bg-primary px-6 py-3 text-sm font-semibold text-white shadow-card hover:opacity-90 transition-opacity">
                Change Dates
            </a>
        </div>

        <form th:if="${not #lists.isEmpty(availability)}"
              th:action="@{/book/rooms}" method="post">

            <div class="grid gap-6 md:grid-cols-2">

                <article th:each="rt, iter : ${availability}"
                         class="overflow-hidden rounded-2xl bg-surface border border-border/80 shadow-card flex flex-col">

                    <div class="relative h-48 w-full overflow-hidden">
                        <img th:if="${#lists.isEmpty(rt.picutres)}"
                             class="h-full w-full object-cover"
                             th:src="@{/images/hotel2.jpg}" alt="Room"/>
                        <img th:if="${not #lists.isEmpty(rt.picutres)}"
                             class="h-full w-full object-cover"
                             th:src="@{'/room-type-picture/' + ${rt.picutres[0].id}}" alt="Room Type Image"/>
                        <span class="absolute top-4 right-4 bg-primary text-white font-sans text-xs font-semibold px-3 py-1.5 rounded-full shadow-md"
                              th:text="'$' + ${rt.basePrice} + ' / night'"></span>
                    </div>

                    <div class="p-5 flex flex-col flex-grow">
                        <h3 class="text-xl font-bold font-display text-text" th:text="${rt.name}">Deluxe</h3>
                        <p class="mt-1 text-xs text-muted"
                           th:text="${rt.maxOccupancy} + ' guests max | ' + ${rt.area} + ' m²'">
                            2 guests max | 32 m²
                        </p>

                        <div class="flex items-center justify-between mt-4 pt-4 border-t border-border/50">
                <span class="text-sm text-muted-foreground">
                  Available: <strong th:text="${rt.availableRooms}"></strong>
                </span>
                            <div class="flex items-center gap-2">
                                <label class="text-sm font-medium text-foreground" th:for="'count-' + ${rt.roomTypeId}">Qty:</label>
                                <input type="hidden" th:name="'roomTypeIds'" th:value="${rt.roomTypeId}"/>
                                <select th:id="'count-' + ${rt.roomTypeId}"
                                        th:name="'counts'"
                                        class="rounded-lg border border-border bg-background px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary">
                                    <option value="0">0</option>
                                    <option th:each="i : ${#numbers.sequence(1, rt.availableRooms)}"
                                            th:value="${i}"
                                            th:text="${i}">1
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>

                </article>

            </div>

            <div class="mt-8 flex items-center justify-between rounded-2xl bg-surface border border-border/80 shadow-card p-6">
                <a th:href="@{/book}"
                   class="rounded-xl border border-border bg-background px-6 py-3 text-sm font-medium text-foreground hover:bg-muted transition-colors">
                    &larr; Change Dates
                </a>
                <button type="submit"
                        class="rounded-xl bg-primary px-8 py-3.5 text-sm font-semibold text-white shadow-card hover:opacity-90 transition-opacity">
                    Continue to Guest Details &rarr;
                </button>
            </div>

        </form>

    </section>

</main>

<div th:replace="~{guest/layout :: footer}"></div>

</body>
</html>
