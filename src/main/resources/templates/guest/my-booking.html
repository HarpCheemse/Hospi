<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Booking | Hospi Hotel</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-background text-text flex flex-col min-h-screen pt-24">

  <!-- HEADER -->
  <div th:replace="~{guest/layout :: header('my-booking')}"></div>

  <main class="flex-grow flex items-center justify-center py-16">
    <div class="mx-auto max-w-md w-full px-6">
      
      <!-- TRACKING CARD -->
      <div class="rounded-xl border border-border bg-surface p-8 shadow-soft">
        
        <div class="text-center mb-8">
          <span class="text-3xl mb-2 block">🔍</span>
          <h2 class="text-3xl font-bold font-display text-text">Track Your Booking</h2>
          <p class="text-xs text-muted mt-2">Enter reservation details to monitor your booking status.</p>
        </div>

        <form class="space-y-5">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-muted mb-2">Email Address</label>
            <input type="email" placeholder="example@email.com" required
                   class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm focus:ring-2 focus:ring-primary outline-none transition"/>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-muted mb-2">Booking Code</label>
            <input type="text" placeholder="e.g. BKM-102938" required
                   class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm focus:ring-2 focus:ring-primary outline-none transition"/>
          </div>

          <button type="button" class="w-full mt-4 rounded-xl bg-primary px-5 py-3 font-semibold text-white shadow-card hover:opacity-90 transition-opacity">
            Track Reservation
          </button>
        </form>

      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <div th:replace="~{guest/layout :: footer}"></div>

</body>
</html>
