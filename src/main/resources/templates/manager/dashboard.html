<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manager Dashboard | Hospi</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="h-screen overflow-hidden bg-background text-text">

<div class="flex h-full">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/manager-sidebar :: sidebar}"></aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto bg-background p-6">

        <!-- PAGE HEADER -->
        <header class="mb-6 flex items-center justify-between">

            <section aria-label="Page title">
                <h1 class="text-2xl font-bold">
                    Manager Dashboard
                </h1>

                <p class="text-sm text-muted">
                    Monitor reservations, room availability, and hotel operations
                </p>
            </section>

            <section aria-label="User profile">
                <div th:replace="~{fragments/components :: userPill('JD', 'John Doe', 'Manager')}"></div>
            </section>

        </header>

        <!-- KPI SECTION -->
        <section aria-label="Key performance indicators"
                 class="mb-6 grid grid-cols-4 gap-4">

            <article th:replace="~{fragments/components :: statCard(
                'New Bookings',
                '840',
                '+8.70% from last week',
                'positive'
            )}"></article>

            <article th:replace="~{fragments/components :: statCard(
                'Check-In',
                '231',
                '+3.56% from last week',
                'positive'
            )}"></article>

            <article th:replace="~{fragments/components :: statCard(
                'Check-Out',
                '124',
                '-1.06% from last week',
                'neutral'
            )}"></article>

            <article th:replace="~{fragments/components :: statCard(
                'Total Revenue',
                '$123,980',
                '+5.70% from last week',
                'positive'
            )}"></article>

        </section>

        <!-- MAIN GRID CONTENT -->
        <section aria-label="Dashboard analytics"
                 class="grid grid-cols-12 gap-4">

            <!-- LEFT COLUMN -->
            <section class="col-span-8 flex flex-col gap-4">

                <article th:replace="~{fragments/components :: panel(
                    'Revenue',
                    'Revenue performance overview',
                    ~{::#revenue-action},
                    ~{::#revenue-content}
                )}">

                    <th:block id="revenue-action">

                        <button th:replace="~{fragments/components :: button(
                            'Last 6 Months',
                            'secondary'
                        )}"></button>

                    </th:block>

                    <th:block id="revenue-content">

                        <div class="flex h-64 items-center justify-center rounded-lg border border-border bg-background text-muted">
                            Revenue Graph
                        </div>

                    </th:block>

                </article>

                <article th:replace="~{fragments/components :: panel(
                    'Reservations',
                    'Booking analytics from the last 7 days',
                    ~{::#reservations-action},
                    ~{::#reservations-content}
                )}">

                    <th:block id="reservations-action">

                        <button th:replace="~{fragments/components :: button(
                            'Last 7 Days',
                            'secondary'
                        )}"></button>

                    </th:block>

                    <th:block id="reservations-content">

                        <div class="flex h-40 items-center justify-center rounded-lg border border-border bg-background text-muted">
                            Reservation Chart
                        </div>

                    </th:block>

                </article>

            </section>

            <!-- RIGHT COLUMN -->
            <section class="col-span-4 flex flex-col gap-4">

                <article th:replace="~{fragments/components :: panel(
                    'Room Availability',
                    'Current occupancy overview',
                    ~{::#availability-action},
                    ~{::#availability-content}
                )}">

                    <th:block id="availability-action">

                        <button class="text-xl leading-none text-muted"
                                type="button"
                                aria-label="More options">
                            ...
                        </button>

                    </th:block>

                    <th:block id="availability-content">

                        <div class="mb-4 flex h-40 items-center justify-center rounded-lg border border-border bg-background text-muted">
                            Availability Bar
                        </div>

                        <div class="grid grid-cols-2 gap-2">

                            <div th:replace="~{fragments/components :: metricTile('Occupied', '286')}"></div>

                            <div th:replace="~{fragments/components :: metricTile('Reserved', '87')}"></div>

                            <div th:replace="~{fragments/components :: metricTile('Available', '32')}"></div>

                            <div th:replace="~{fragments/components :: metricTile('Not Ready', '13')}"></div>

                        </div>

                    </th:block>

                </article>

                <article th:replace="~{fragments/components :: panel(
                    'Recent Activity',
                    'Latest hotel operations',
                    ~{},
                    ~{::#activity-content}
                )}">

                    <th:block id="activity-content">

                        <div class="flex flex-col gap-4">

                            <article th:replace="~{fragments/components :: activityItem(
                                'New reservation created',
                                '2 minutes ago',
                                'primary'
                            )}"></article>

                            <article th:replace="~{fragments/components :: activityItem(
                                'Room 203 checked in',
                                '15 minutes ago',
                                'success'
                            )}"></article>

                            <article th:replace="~{fragments/components :: activityItem(
                                'Cleaning task assigned',
                                '34 minutes ago',
                                'warning'
                            )}"></article>

                        </div>

                    </th:block>

                </article>

            </section>

        </section>

    </main>

</div>

</body>
</html>
