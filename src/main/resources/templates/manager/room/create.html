<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Rooms | Hospi</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.9/cdn.min.js" defer></script>
</head>

<body class="staff-layout">

<!-- SIDEBAR -->
<div th:replace="~{fragments/manager-sidebar :: sidebar}"></div>

<!-- MAIN -->
<main class="staff-page">

    <!-- TOAST -->
    <div th:replace="~{fragments/components/toast :: toast}"></div>

    <!-- PAGE HEADER -->
    <div class="staff-page-header">

        <div class="flex items-center gap-4">

            <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-primary/10 text-primary">
                <img th:src="@{/assets/icons/door-open.svg}" alt="">
            </div>

            <div>
                <h1 class="staff-page-title">Add Rooms</h1>
                <p class="page-description">Generate multiple rooms at once for a selected floor.</p>
            </div>

        </div>

        <a th:href="@{/manager/rooms}"
           class="btn btn-secondary">
            Back
        </a>

    </div>

    <!-- FORM -->
    <form th:action="@{/manager/rooms/create}"
          th:object="${form}"
          method="post"
          class="grid grid-cols-2 gap-6"
          novalidate>

        <!-- ROOM GENERATION SETTINGS -->
        <section class="card col-span-2">

            <div class="border-b border-border px-6 py-5">
                <div class="flex items-center gap-3">
                    <img th:src="@{/assets/icons/door-open.svg}" class="h-5 w-5 text-primary opacity-80" alt="">
                    <div>
                        <h2 class="text-xl font-semibold">Room Generation Settings</h2>
                        <p class="mt-1 text-sm text-muted-foreground">Configure how room numbers should be generated.</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-5 p-6 md:grid-cols-3">

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium">Floor <span class="text-danger">*</span></label>
                    <div th:replace="~{fragments/form-error :: error('floor')}"></div>
                    <select th:field="*{floor}" class="input"
                            th:classappend="${#fields.hasErrors('floor')} ? 'input-error' : ''">
                        <option value="">Select Floor</option>
                        <option th:each="floor : ${#numbers.sequence(1, hotel.floorCount)}"
                                th:value="${floor}" th:text="|Floor ${floor}|">
                        </option>
                    </select>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium">Number of Rooms <span class="text-danger">*</span></label>
                    <div th:replace="~{fragments/form-error :: error('numberOfRooms')}"></div>
                    <input type="number" min="1" max="99"
                           th:field="*{numberOfRooms}"
                           class="input"
                           th:classappend="${#fields.hasErrors('numberOfRooms')} ? 'input-error' : ''"
                           placeholder="10">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium">Default Room Type <span class="text-danger">*</span></label>
                    <div th:replace="~{fragments/form-error :: error('roomTypeId')}"></div>
                    <select th:field="*{roomTypeId}" class="input"
                            th:classappend="${#fields.hasErrors('roomTypeId')} ? 'input-error' : ''">
                        <option value="">No Room Type</option>
                        <option th:each="roomType : ${roomTypes}"
                                th:value="${roomType.id}" th:text="${roomType.name}">
                        </option>
                    </select>
                </div>

            </div>

        </section>

        <!-- ACTIONS -->
        <section class="card col-span-2">

            <div class="flex items-center justify-end gap-3 p-5">

                <a th:href="@{/manager/rooms}"
                   class="btn btn-secondary btn-lg">
                    Cancel
                </a>

                <button type="submit"
                        class="btn btn-primary btn-lg">
                    Generate Rooms
                </button>

            </div>

        </section>

    </form>

</main>

</body>
</html>
