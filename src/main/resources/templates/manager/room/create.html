<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Rooms | Hospi</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.9/cdn.min.js" defer></script>
</head>

<body class="staff-layout">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/manager-sidebar :: sidebar}"></div>

    <!-- MAIN -->
    <main class="staff-page">
        <!-- TOASTS -->
        <div th:replace="~{fragments/components/toast :: toast}"></div>

        <!-- HEADER -->
        <div class="staff-page-header">

            <div>

                <h1 class="staff-page-title">
                    Add Rooms
                </h1>

                <p class="page-description">
                    Generate multiple rooms at once for a selected floor.
                </p>

            </div>

            <a th:href="@{/manager/rooms}"
               class="btn btn-secondary">
                Back to Rooms
            </a>

        </div>

        <form th:action="@{/manager/rooms/create}"
              th:object="${form}"
              method="post"
              novalidate>

            <section class="card">

                <div class="border-b border-border p-5">

                    <h2 class="text-lg font-semibold">
                        Room Generation Settings
                    </h2>

                    <p class="mt-1 text-sm text-muted-foreground">
                        Configure how room numbers should be generated.
                    </p>

                </div>

                <div class="grid grid-cols-2 gap-5 p-5">

                    <!-- FLOOR -->
                    <div>

                        <label class="mb-2 block text-sm font-medium">
                            Floor
                        </label>

                        <select th:field="*{floor}" class="input w-full">

                            <option value="">
                                Select Floor
                            </option>

                            <option th:each="floor : ${#numbers.sequence(1, hotel.floorCount)}"
                                    th:value="${floor}"
                                    th:text="|Floor ${floor}|">
                            </option>

                        </select>
                        <p th:if="${#fields.hasErrors('floor')}"
                           th:errors="*{floor}"
                           class="mt-1 text-sm text-danger">
                        </p>

                    </div>

                    <!-- ROOM COUNT -->
                    <div>

                        <label class="mb-2 block text-sm font-medium">
                            Number of Rooms
                        </label>

                        <input type="number"
                               th:field="*{numberOfRooms}"
                               class="input w-full"
                               placeholder="10">
                        <p th:if="${#fields.hasErrors('numberOfRooms')}"
                           th:errors="*{numberOfRooms}"
                           class="mt-1 text-sm text-danger">
                        </p>
                    </div>

                    <!-- ROOM TYPE -->
                    <div>

                        <label class="mb-2 block text-sm font-medium">
                            Default Room Type
                        </label>

                        <select th:field="*{roomTypeId}" class="input w-full">

                            <option value="">
                                No Room Type
                            </option>

                            <option th:each="roomType : ${roomTypes}"
                                    th:value="${roomType.id}"
                                    th:text="${roomType.name}">
                            </option>

                        </select>
                        <p th:if="${#fields.hasErrors('roomTypeId')}"
                           th:errors="*{roomTypeId}"
                           class="mt-1 text-sm text-danger">
                        </p>

                    </div>

                </div>

            </section>

            <!-- ACTIONS -->
            <div class="mt-6 flex justify-end gap-3">

                <a th:href="@{/manager/rooms}"
                   class="btn btn-secondary btn-lg">
                    Cancel
                </a>

                <button type="submit"
                        class="btn btn-primary btn-lg">
                    Generate Rooms
                </button>

            </div>

        </form>

    </main>

</body>
</html>
