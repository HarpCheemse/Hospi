<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rooms | Hospi</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.9/cdn.min.js" defer></script>
</head>

<body class="bg-background text-text">

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/manager-sidebar :: sidebar}"></div>

    <!-- MAIN -->
    <main class="flex-1 p-6">
        <!-- TOASTS -->
        <div th:replace="~{fragments/components/toast :: toast}"></div>

        <!-- HEADER -->
        <div class="mb-6 flex items-start justify-between">

            <div>

                <h1 class="text-2xl font-bold">
                    Rooms
                </h1>

                <p class="mt-1 text-sm text-muted">
                    Monitor room availability, housekeeping status, and assignments.
                </p>

            </div>

            <div class="flex gap-3">

                <a th:href="@{/manager/rooms/create}"
                   class="rounded-xl bg-primary px-5 py-3 text-sm font-medium text-white hover:opacity-90">
                    Add Room
                </a>

            </div>

        </div>

        <!-- EMPTY STATE -->
        <div th:if="${hotel.floorCount == null or hotel.floorCount == 0}"
             class="rounded-2xl border border-border bg-surface p-10 text-center">

            <h2 class="text-lg font-semibold">
                No Floors Configured
            </h2>

            <p class="mt-2 text-sm text-muted">
                Configure your hotel's floor count before creating rooms.
            </p>

        </div>

        <!-- FLOORS -->
        <div th:if="${hotel.floorCount != null and hotel.floorCount > 0}"
             class="flex flex-col gap-6">

            <!-- FLOOR -->
            <section th:each="floor : ${floors}"
                     class="rounded-2xl border border-border bg-surface shadow-card">

                <!-- FLOOR HEADER -->
                <div class="flex items-center justify-between border-b border-border p-5">

                    <div>

                        <h2 class="text-lg font-semibold"
                            th:text="|Floor ${floor.number}|">
                            Floor 1
                        </h2>

                        <p class="text-sm text-muted"
                           th:text="|${floor.roomCount} rooms|">
                            10 rooms
                        </p>

                    </div>


                </div>

                <!-- ROOM GRID -->
                <div class="grid grid-cols-2 gap-4 p-5 md:grid-cols-4 xl:grid-cols-6">

                    <!-- ROOM CARD -->
                    <button th:each="room : ${floor.rooms}"
                            class="rounded-2xl border border-border bg-background p-4 text-left transition hover:border-primary hover:shadow-card">

                        <!-- ROOM NUMBER -->
                        <div class="flex justify-between">
                            <div class="text-xl font-bold"
                                 th:text="${room.roomNumber}">
                                101
                            </div>
                            <a th:href="@{|/manager/rooms/${room.id}/edit|}">Edit</a>
                        </div>

                        <!-- ROOM TYPE -->
                        <div class="mt-1 text-xs text-muted"
                             th:text="${room.roomTypeName}">
                            Deluxe King
                        </div>

                        <!-- STATUS -->
                        <div class="mt-4 flex flex-col gap-2">

                            <!-- OCCUPANCY -->
                            <span class="rounded-lg px-2 py-1 text-center text-xs font-medium"

                                  th:classappend="
                                  ${room.occupancyStatus?.name() == 'VACANT'} ? ' bg-success/10 text-success' :
                                  (${room.occupancyStatus?.name() == 'OCCUPIED'} ? ' bg-primary/10 text-primary' :
                                  ' bg-muted/10 text-muted')"

                                  th:text="${room.occupancyStatus}">
                                VACANT
                            </span>

                            <!-- CONDITION -->
                            <span class="rounded-lg px-2 py-1 text-center text-xs font-medium"

                                  th:classappend="
                                  ${room.conditionStatus?.name() == 'CLEAN'} ? ' bg-success/10 text-success' :
                                  (${room.conditionStatus?.name() == 'DIRTY'} ? ' bg-warning/10 text-warning' :
                                  (${room.conditionStatus?.name() == 'MAINTENANCE'} ? ' bg-danger/10 text-danger' :
                                  ' bg-muted/10 text-muted'))"

                                  th:text="${room.conditionStatus}">
                                CLEAN
                            </span>

                        </div>

                    </button>

                </div>

            </section>

        </div>

    </main>

</div>

</body>
</html>
