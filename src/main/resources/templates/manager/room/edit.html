<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Room | Hospi</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.9/cdn.min.js" defer></script>

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <script th:inline="javascript">
        window.csrfToken = /*[[${_csrf.token}]]*/ '';
    </script>

    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>

<body class="staff-layout">

<!-- SIDEBAR -->
<div th:replace="~{fragments/manager-sidebar :: sidebar}"></div>

<!-- MAIN -->
<main class="staff-page">

    <!-- TOAST -->
    <div th:replace="~{fragments/components/toast :: toast}"></div>

    <!-- PAGE HEADER -->
    <div class="staff-page-header">

        <div class="flex items-center gap-4">

            <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-primary/10 text-primary">
                <img th:src="@{/assets/icons/door-open.svg}" alt="">
            </div>

            <div>
                <h1 class="staff-page-title">Edit Room</h1>
                <p class="page-description" th:text="|Room ${form.roomNumber}|">Room 101</p>
            </div>

        </div>

        <a th:href="@{/manager/rooms}"
           class="btn btn-secondary">
            Back
        </a>

    </div>

    <!-- FORM -->
    <form th:object="${form}"
          th:action="@{|/manager/rooms/${roomId}/edit|}"
          method="post"
          class="grid grid-cols-2 gap-6"
          novalidate>

        <!-- ROOM DETAILS -->
        <section class="card col-span-2">

            <div class="border-b border-border px-6 py-5">
                <div class="flex items-center gap-3">
                    <img th:src="@{/assets/icons/door-open.svg}" class="h-5 w-5 text-primary opacity-80" alt="">
                    <div>
                        <h2 class="text-xl font-semibold">Room Details</h2>
                        <p class="mt-1 text-sm text-muted-foreground">Modify room number and room type.</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-5 p-6 md:grid-cols-2">

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium">Room Number <span class="text-danger">*</span></label>
                    <div th:replace="~{fragments/form-error :: error('roomNumber')}"></div>
                    <input th:field="*{roomNumber}"
                           type="text" maxlength="3" inputmode="numeric"
                           placeholder="101" class="input"
                           th:classappend="${#fields.hasErrors('roomNumber')} ? 'input-error' : ''"
                           required>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium">Room Type <span class="text-danger">*</span></label>
                    <div th:replace="~{fragments/form-error :: error('roomTypeId')}"></div>
                    <select th:field="*{roomTypeId}" class="input"
                            th:classappend="${#fields.hasErrors('roomTypeId')} ? 'input-error' : ''">
                        <option th:each="roomType : ${roomTypes}"
                                th:value="${roomType.id}" th:text="${roomType.name}">
                        </option>
                    </select>
                </div>

            </div>

        </section>

        <!-- LOCATION & STATUS -->
        <section class="card col-span-2">

            <div class="border-b border-border px-6 py-5">
                <div class="flex items-center gap-3">
                    <img th:src="@{/assets/icons/building-2.svg}" class="h-5 w-5 text-primary opacity-80" alt="">
                    <div>
                        <h2 class="text-xl font-semibold">Location &amp; Status</h2>
                        <p class="mt-1 text-sm text-muted-foreground">Floor assignment and housekeeping status.</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-5 p-6 md:grid-cols-2">

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium">Floor</label>
                    <div class="min-h-[1.25rem]"></div>
                    <p class="rounded-xl border border-border bg-background px-4 py-3 text-sm"
                       th:text="|Floor ${floor}|">
                        Floor 1
                    </p>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium">Condition Status <span class="text-danger">*</span></label>
                    <div th:replace="~{fragments/form-error :: error('conditionStatus')}"></div>
                    <select th:field="*{conditionStatus}" class="input"
                            th:classappend="${#fields.hasErrors('conditionStatus')} ? 'input-error' : ''">
                        <option th:each="cs : ${conditionStatuses}"
                                th:value="${cs}" th:text="${cs}">
                        </option>
                    </select>
                </div>

            </div>

        </section>

        <!-- ACTIONS -->
        <section class="card col-span-2">

            <div x-data="{ deleteModalOpen: false }"
                 class="flex items-center justify-end gap-3 p-5">

                <a th:href="@{/manager/rooms}"
                   class="btn btn-secondary btn-lg">
                    Cancel
                </a>

                <button type="button"
                        @click="deleteModalOpen = true"
                        class="btn btn-danger btn-lg">
                    Delete
                </button>

                <button type="submit"
                        class="btn btn-primary btn-lg">
                    Save Changes
                </button>

                <!-- DELETE MODAL -->
                <div x-show="deleteModalOpen"
                     x-cloak
                     class="fixed inset-0 z-50 flex items-center justify-center">

                    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"
                         @click="deleteModalOpen = false">
                    </div>

                    <div x-show="deleteModalOpen"
                         x-transition:enter="transition ease-out duration-200"
                         x-transition:enter-start="opacity-0 scale-95"
                         x-transition:enter-end="opacity-100 scale-100"
                         x-transition:leave="transition ease-in duration-150"
                         x-transition:leave-start="opacity-100 scale-100"
                         x-transition:leave-end="opacity-0 scale-95"
                         @click.stop
                         class="relative mx-4 w-full max-w-md rounded-2xl border border-border bg-surface p-6 shadow-2xl">

                        <h2 class="text-lg font-semibold text-foreground">Delete Room</h2>
                        <p class="mt-2 text-sm text-muted-foreground">
                            Are you sure you want to delete this room? This action cannot be undone.
                        </p>

                        <div class="mt-6 flex justify-end gap-3">
                            <button type="button"
                                    @click="deleteModalOpen = false"
                                    class="btn btn-secondary">
                                Cancel
                            </button>
                            <button type="submit"
                                    form="deleteForm"
                                    class="btn btn-danger">
                                Delete
                            </button>
                        </div>

                    </div>
                </div>

            </div>

        </section>

    </form>

    <!-- DELETE FORM -->
    <form id="deleteForm"
          th:action="@{/manager/rooms/delete/{id}(id=${roomId})}"
          method="post">
    </form>

</main>

</body>
</html>
