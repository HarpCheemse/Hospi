<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Room | Hospi</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.9/cdn.min.js" defer></script>
</head>

<body class="bg-background text-text">

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/manager-sidebar :: sidebar}"></div>

    <!-- MAIN -->
    <main class="flex-1 p-6">
        <!-- TOASTS -->
        <div th:replace="~{fragments/components/toast :: toast}"></div>

        <!-- HEADER -->
        <div class="mb-6 flex items-start justify-between">

            <div>

                <h1 class="text-2xl font-bold">
                    Edit Room
                </h1>

                <p class="mt-1 text-sm text-muted">
                    Update room information.
                </p>

            </div>

            <a th:href="@{/manager/rooms}"
               class="rounded-xl border border-border bg-surface px-4 py-2 text-sm font-medium hover:bg-background">
                Back to Rooms
            </a>

        </div>

        <form th:object="${form}"
              th:action="@{|/manager/rooms/${roomId}/edit|}"
              method="post" novalidate>

            <section class="rounded-2xl border border-border bg-surface shadow-card">

                <div class="border-b border-border p-5">

                    <h2 class="text-lg font-semibold">
                        Room Details
                    </h2>

                    <p class="mt-1 text-sm text-muted">
                        Modify room number and room type.
                    </p>

                </div>

                <div class="grid grid-cols-2 gap-5 p-5">

                    <!-- ROOM NUMBER -->
                    <div>

                        <label class="mb-2 block text-sm font-medium">
                            Room Number
                        </label>

                        <input
                                th:field="*{roomNumber}"
                                type="text"
                                maxlength="3"
                                inputmode="numeric"
                                class="w-full rounded-xl border border-border
                                bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary"
                                th:classappend="${#fields.hasErrors('roomNumber')} ? 'border-danger focus:ring-danger' : ''"
                                required>

                        <!-- INLINE ERROR -->
                        <p th:if="${#fields.hasErrors('roomNumber')}"
                           th:errors="*{roomNumber}"
                           class="mt-1 text-sm text-danger">
                        </p>

                    </div>

                    <!-- ROOM TYPE -->
                    <div>

                        <label class="mb-2 block text-sm font-medium">
                            Room Type
                        </label>

                        <select th:field="*{roomTypeId}"
                                class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary
                   "
                                th:classappend="${#fields.hasErrors('roomTypeId')} ? 'border-danger focus:ring-danger' : ''">

                            <option th:each="roomType : ${roomTypes}"
                                    th:value="${roomType.id}"
                                    th:text="${roomType.name}">
                            </option>

                        </select>

                        <p th:if="${#fields.hasErrors('roomTypeId')}"
                           th:errors="*{roomTypeId}"
                           class="mt-1 text-sm text-danger">
                        </p>

                    </div>

                </div>

            </section>

            <!-- READ ONLY INFO -->
            <section class="mt-6 rounded-2xl border border-border bg-surface shadow-card">

                <div class="border-b border-border p-5">

                    <h2 class="text-lg font-semibold">
                        Room Information
                    </h2>

                </div>

                <div class="grid grid-cols-3 gap-5 p-5">

                    <div class="flex justify-between">
                        <div>
                            <p class="text-sm text-muted">
                                Floor
                            </p>

                            <p class="mt-1 font-medium"
                               th:text="${floor}">
                                1
                            </p>
                        </div>
                        <select th:field="*{conditionStatus}"
                                class="w-48 rounded-xl border border-border bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary
                   "
                                th:classappend="${#fields.hasErrors('conditionStatus')} ? 'border-danger focus:ring-danger' : ''">

                            <option th:each="conditionStatus : ${conditionStatuses}"
                                    th:value="${conditionStatus}"
                                    th:text="${conditionStatus}">
                            </option>

                        </select>
                    </div>

                </div>

            </section>

            <!-- ACTIONS -->
            <div class="mt-6 flex justify-end gap-3">

                <a th:href="@{/manager/rooms}"
                   class="rounded-xl border border-border bg-surface px-5 py-3 text-sm font-medium">
                    Cancel
                </a>

                <button type="submit"
                        class="rounded-xl bg-primary px-5 py-3 text-sm font-medium text-white hover:opacity-90">
                    Save Changes
                </button>

            </div>

        </form>

    </main>

</div>

</body>
</html>
