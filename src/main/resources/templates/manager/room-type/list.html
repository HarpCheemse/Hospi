<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room Types | Hospi</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="bg-background text-text">

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/manager-sidebar :: sidebar}"></div>

    <!-- MAIN -->
    <main class="flex-1 bg-background p-6">

        <!-- HEADER -->
        <div class="mb-6 flex items-start justify-between">

            <div>
                <h1 class="text-2xl font-bold text-text">Room Types</h1>

                <p class="mt-1 text-sm text-muted">
                    Manage room categories, pricing, occupancy, and operational availability.
                </p>
            </div>

            <a th:href="@{/manager/room-types/create}"
               class="rounded-xl bg-primary px-4 py-2 text-sm font-medium text-white hover:opacity-90">
                + Create Room Type
            </a>

        </div>

        <!-- EMPTY STATE -->
        <div th:if="${#lists.isEmpty(roomTypes)}"
             class="rounded-2xl border border-border bg-surface p-10 text-center text-muted">
            No room types found. Create your first one.
        </div>

        <!-- GRID -->
        <div th:if="${!#lists.isEmpty(roomTypes)}"
             class="grid grid-cols-3 gap-5">

            <!-- CARD -->
            <section th:each="rt : ${roomTypes}"
                     class="overflow-hidden rounded-2xl border border-border bg-surface shadow-card">

                <!-- IMAGE -->
                <div class="flex h-48 items-center justify-center border-b border-border bg-background text-muted">

                    <img th:if="${!#lists.isEmpty(rt.pictures)}"
                         th:src="@{/room-type-picture/{id}(id=${rt.pictures[0].id})}"
                         alt="Room Image"
                         class="h-full w-full object-cover">

                    <span th:if="${#lists.isEmpty(rt.pictures)}">  No Image
                                     </span>

                </div>
                <div class="p-5">

                    <!-- TOP -->
                    <div class="mb-3 flex items-start justify-between">

                        <div>
                            <h2 class="text-lg font-semibold"
                                th:text="${rt.name}">
                                Room Name
                            </h2>

                            <p class="text-sm text-muted"
                               th:text="${rt.bedType + ' · ' + rt.area + 'm²'}">
                                Bed · Area
                            </p>
                        </div>

                        <span class="rounded-full px-2 py-1 text-xs font-medium"
                              th:classappend="${rt.active} ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
                              th:text="${rt.active} ? 'ACTIVE' : 'DISABLED'">
                            Status
                        </span>

                    </div>

                    <!-- STATS -->
                    <div class="mb-4 grid grid-cols-2 gap-3">

                        <div class="rounded-lg border border-border bg-background p-3">
                            <p class="text-xs text-muted">Rooms</p>
                            <p class="text-lg font-semibold"
                               th:text="0">
                                0
                            </p>
                        </div>

                        <div class="rounded-lg border border-border bg-background p-3">
                            <p class="text-xs text-muted">Base Price</p>
                            <p class="text-lg font-semibold"
                               th:text="|$${rt.basePrice}|">
                                $0
                            </p>
                        </div>

                    </div>

                    <!-- DESCRIPTION -->
                    <p class="mb-4 line-clamp-2 text-sm text-muted"
                       th:text="${rt.description}">
                        Description
                    </p>

                    <!-- ACTIONS -->
                    <div class="flex items-center gap-2">

                        <a th:href="@{'/manager/room-types/' + ${rt.id}}"
                           class="rounded-xl bg-gray-100 px-3 py-2 text-sm hover:bg-gray-200">
                            View
                        </a>

                        <a th:href="@{'/manager/room-types/edit/' + ${rt.id}}"
                           class="rounded-xl bg-primary px-3 py-2 text-sm text-white hover:opacity-90">
                            Edit
                        </a>

                    </div>

                </div>

            </section>

        </div>

    </main>

</div>

</body>
</html>
