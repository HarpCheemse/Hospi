<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room Types | Hospi</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="staff-layout">

    <div th:replace="~{fragments/manager-sidebar :: sidebar}"></div>

    <main class="staff-page">

        <div class="staff-page-header">

            <div>
                <h1 class="staff-page-title">Room Types</h1>

                <p class="page-description">
                    Manage room categories, pricing, occupancy, and operational availability.
                </p>
            </div>

            <a th:href="@{/manager/room-types/create}"
               class="btn btn-primary">
                + Create Room Type
            </a>

        </div>

        <!-- EMPTY STATE -->
        <div th:if="${#lists.isEmpty(roomTypes)}" class="card-empty">
            <p class="text-muted-foreground">No room types found. Create your first one.</p>
        </div>

        <!-- GRID -->
        <div th:if="${!#lists.isEmpty(roomTypes)}"
             class="grid grid-cols-3 gap-5">

            <!-- CARD -->
             <section th:each="rt : ${roomTypes}"
                      class="overflow-hidden card">

                <!-- IMAGE -->
                <div class="flex h-48 items-center justify-center border-b border-border bg-background text-muted-foreground">

                    <img th:if="${!#lists.isEmpty(rt.pictures)}"
                         th:src="@{/room-type-picture/{id}(id=${rt.pictures[0].id})}"
                         alt="Room Image"
                         class="h-full w-full object-cover">

                    <span th:if="${#lists.isEmpty(rt.pictures)}">  No Image
                                     </span>

                </div>
                <div class="p-5">

                    <!-- TOP -->
                    <div class="mb-3 flex items-start justify-between">

                        <div>
                            <h2 class="text-lg font-semibold"
                                th:text="${rt.name}">
                                Room Name
                            </h2>

                            <p class="text-sm text-muted-foreground"
                               th:text="${rt.bedType + ' · ' + rt.area + 'm²'}">
                                Bed · Area
                            </p>
                        </div>

                        <span th:classappend="${rt.active} ? 'pill-success' : 'pill-danger'"
                              th:text="${rt.active} ? 'ACTIVE' : 'DISABLED'">
                            Status
                        </span>

                    </div>

                    <!-- STATS -->
                    <div class="mb-4 grid grid-cols-2 gap-3">

                        <div class="rounded-lg border border-border bg-background p-3">
                            <p class="text-xs text-muted-foreground">Rooms</p>
                            <p class="text-lg font-semibold"
                                th:text="0">
                                0
                            </p>
                        </div>

                        <div class="rounded-lg border border-border bg-background p-3">
                            <p class="text-xs text-muted-foreground">Base Price</p>
                            <p class="text-lg font-semibold"
                                th:text="|$${rt.basePrice}|">
                                $0
                            </p>
                        </div>

                    </div>

                    <!-- DESCRIPTION -->
                    <p class="mb-4 line-clamp-2 text-sm text-muted-foreground"
                       th:text="${rt.description}">
                        Description
                    </p>

                    <!-- ACTIONS -->
                    <div class="flex items-center gap-2">

                        <a th:href="@{'/manager/room-types/' + ${rt.id}}"
                           class="btn btn-secondary btn-sm">
                            View
                        </a>

                        <a th:href="@{'/manager/room-types/edit/' + ${rt.id}}"
                           class="btn btn-primary btn-sm">
                            Edit
                        </a>

                    </div>

                </div>

            </section>

        </div>

    </main>

</body>
</html>
