<!DOCTYPE html>
<html lang="en"

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | Hospi</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="staff-layout">

<aside th:replace="~{fragments/manager-sidebar :: sidebar}"></aside>

<script th:src="@{/js/notification-poller.js}"></script>
<script>startNotificationPolling(30000);</script>
