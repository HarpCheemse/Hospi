<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Edit System Configuration | Hospi</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.9/cdn.min.js" defer></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>

<body class="staff-layout">

<div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

<main class="staff-page">

    <div th:replace="~{fragments/components/toast :: toast}"></div>

    <!-- HEADER -->
    <div class="staff-page-header">

        <div class="flex items-center gap-4">

            <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-primary/10 text-primary">
                <img th:src="@{/assets/icons/settings.svg}" alt="">
            </div>

            <div>
                <h1 class="staff-page-title">Edit System Configuration</h1>
                <p class="page-description">Configure hotel financial settings and booking rules.</p>
            </div>

        </div>

        <a th:href="@{/admin/configs}"
           class="btn btn-secondary btn-lg">Back</a>

    </div>

    <form th:object="${form}"
          th:action="@{/admin/configs/edit}"
          method="post"
          class="grid grid-cols-2 gap-6"
          novalidate>

        <!-- FINANCIAL -->
        <section class="card col-span-2">

            <div class="border-b border-border px-6 py-5">
                <div class="flex items-center gap-3">
                    <img th:src="@{/assets/icons/circle-dollar-sign.svg}" class="h-5 w-5 text-primary opacity-80" alt="">
                    <div>
                        <h2 class="text-xl font-semibold">Financial Settings</h2>
                        <p class="mt-1 text-sm text-muted-foreground">Configure tax, deposits, and fees.</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-5 p-6 md:grid-cols-2">

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium">Tax Rate (%) <span class="text-danger">*</span></label>
                    <div th:replace="~{fragments/form-error :: error('taxRate')}"></div>
                    <input th:field="*{taxRate}" type="number" step="0.01" min="0" class="input"
                           th:classappend="${#fields.hasErrors('taxRate')} ? 'input-error' : ''">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium">Default Deposit Percentage (%) <span class="text-danger">*</span></label>
                    <div th:replace="~{fragments/form-error :: error('defaultDepositPercentage')}"></div>
                    <input th:field="*{defaultDepositPercentage}" type="number" step="0.01" min="0" class="input"
                           th:classappend="${#fields.hasErrors('defaultDepositPercentage')} ? 'input-error' : ''">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium">Late Checkout Fee <span class="text-danger">*</span></label>
                    <div th:replace="~{fragments/form-error :: error('lateCheckoutFee')}"></div>
                    <input th:field="*{lateCheckoutFee}" type="number" step="0.01" min="0" class="input"
                           th:classappend="${#fields.hasErrors('lateCheckoutFee')} ? 'input-error' : ''">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium">Extra Guest Fee <span class="text-danger">*</span></label>
                    <div th:replace="~{fragments/form-error :: error('extraGuestFee')}"></div>
                    <input th:field="*{extraGuestFee}" type="number" step="0.01" min="0" class="input"
                           th:classappend="${#fields.hasErrors('extraGuestFee')} ? 'input-error' : ''">
                </div>

            </div>

        </section>

        <!-- BOOKING RULES -->
        <section class="card col-span-2">

            <div class="border-b border-border px-6 py-5">
                <div class="flex items-center gap-3">
                    <img th:src="@{/assets/icons/calendar-days.svg}" class="h-5 w-5 text-primary opacity-80" alt="">
                    <div>
                        <h2 class="text-xl font-semibold">Booking Rules</h2>
                        <p class="mt-1 text-sm text-muted-foreground">Configure reservation limits and cancellation policies.</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-5 p-6 md:grid-cols-2">

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium">Pending Booking Expiry (Minutes) <span class="text-danger">*</span></label>
                    <div th:replace="~{fragments/form-error :: error('pendingBookingExpiryMinutes')}"></div>
                    <input th:field="*{pendingBookingExpiryMinutes}" type="number" min="1" class="input"
                           th:classappend="${#fields.hasErrors('pendingBookingExpiryMinutes')} ? 'input-error' : ''">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium">Cancellation Hours Before Check-in <span class="text-danger">*</span></label>
                    <div th:replace="~{fragments/form-error :: error('cancellationHoursBeforeCheckin')}"></div>
                    <input th:field="*{cancellationHoursBeforeCheckin}" type="number" min="0" class="input"
                           th:classappend="${#fields.hasErrors('cancellationHoursBeforeCheckin')} ? 'input-error' : ''">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium">Maximum Booking Days <span class="text-danger">*</span></label>
                    <div th:replace="~{fragments/form-error :: error('maximumBookingDays')}"></div>
                    <input th:field="*{maximumBookingDays}" type="number" min="1" class="input"
                           th:classappend="${#fields.hasErrors('maximumBookingDays')} ? 'input-error' : ''">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium">Maximum Rooms Per Booking <span class="text-danger">*</span></label>
                    <div th:replace="~{fragments/form-error :: error('maximumRoomPerBook')}"></div>
                    <input th:field="*{maximumRoomPerBook}" type="number" min="1" class="input"
                           th:classappend="${#fields.hasErrors('maximumRoomPerBook')} ? 'input-error' : ''">
                </div>

            </div>

        </section>

        <!-- CANCELLATION & REFUND -->
        <section class="card col-span-2">

            <div class="border-b border-border px-6 py-5">
                <div class="flex items-center gap-3">
                    <img th:src="@{/assets/icons/clipboard-check.svg}" class="h-5 w-5 text-primary opacity-80" alt="">
                    <div>
                        <h2 class="text-xl font-semibold">Cancellation &amp; Refund</h2>
                        <p class="mt-1 text-sm text-muted-foreground">Configure refund policy for confirmed bookings.</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-5 p-6 md:grid-cols-2">

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium">Refund Percentage (%) <span class="text-danger">*</span></label>
                    <div th:replace="~{fragments/form-error :: error('refundPercentage')}"></div>
                    <input th:field="*{refundPercentage}" type="number" step="0.01" min="0" max="100" class="input"
                           th:classappend="${#fields.hasErrors('refundPercentage')} ? 'input-error' : ''">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium">Full Refund Window (Hours) <span class="text-danger">*</span></label>
                    <div th:replace="~{fragments/form-error :: error('fullRefundWindowHours')}"></div>
                    <input th:field="*{fullRefundWindowHours}" type="number" min="0" class="input"
                           th:classappend="${#fields.hasErrors('fullRefundWindowHours')} ? 'input-error' : ''">
                </div>

            </div>

        </section>

        <!-- ACTIONS -->
        <section class="card col-span-2">

            <div class="flex items-center justify-end gap-3 p-5">

                <a th:href="@{/admin/configs}"
                   class="btn btn-secondary btn-lg">Cancel</a>

                <button type="submit"
                        class="btn btn-primary btn-lg">Save Configuration</button>

            </div>

        </section>

    </form>

</main>

</body>
</html>
