<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<aside th:fragment="sidebar"
       class="flex h-full w-64 flex-col border-r border-border bg-surface p-5">

    <!-- LOGO -->
    <div class="mb-8 flex items-center gap-3">

        <div class="h-9 w-9 rounded-lg bg-primary"></div>

        <span class="text-lg font-semibold text-foreground">
            Hospi
        </span>

    </div>

    <!-- NAVIGATION -->
    <nav class="flex-1 overflow-y-auto space-y-1 text-sm">


        <a th:href="@{/manager}"
           class="flex items-center gap-3 rounded-lg p-2"
           th:classappend="${activeSidebar == 'DASHBOARD'}
           ? ' bg-primary/10 text-primary font-medium'
           : ' hover:bg-muted text-foreground'">

            <img th:src="@{/assets/icons/layout-grid.svg}"
                 alt="Dashboard">

            Dashboard

        </a>

        <a th:href="@{/manager/room-types}"
           class="flex items-center gap-3 rounded-lg p-2"
           th:classappend="${activeSidebar == 'ROOM_TYPES'}
           ? ' bg-primary/10 text-primary font-medium'
           : ' hover:bg-muted text-foreground'">

            <img th:src="@{/assets/icons/bed-double.svg}"
                 alt="Room Types">

            Room Types

        </a>

        <a th:href="@{/manager/rooms}"
           class="flex items-center gap-3 rounded-lg p-2"
           th:classappend="${activeSidebar == 'ROOMS'}
           ? ' bg-primary/10 text-primary font-medium'
           : ' hover:bg-muted text-foreground'">

            <img th:src="@{/assets/icons/bed-double.svg}"
                 alt="Room">

            Room

        </a>

        <a th:href="@{/manager/reservations}"
           class="flex items-center gap-3 rounded-lg p-2"
           th:classappend="${activeSidebar == 'RESERVATIONS'}
           ? ' bg-primary/10 text-primary font-medium'
           : ' hover:bg-muted text-foreground'">

            <img th:src="@{/assets/icons/calendar-check.svg}"
                 alt="Reservations">

            Reservations

        </a>

        <a th:href="@{/manager/notifications}"
           class="flex items-center justify-between rounded-lg p-2"
           th:classappend="${activeSidebar == 'NOTIFICATIONS'}
           ? ' bg-primary/10 text-primary font-medium'
           : ' hover:bg-muted text-foreground'">

            <div class="flex items-center gap-3">

                <img th:src="@{/assets/icons/bell.svg}"
                     alt="Notifications">

                Notifications

            </div>

            <span class="pill-warning hidden" data-notification-badge>0</span>

        </a>

        <a th:href="@{/manager/revenues}"
           class="flex items-center gap-3 rounded-lg p-2"
           th:classappend="${activeSidebar == 'REVENUES'}
           ? ' bg-primary/10 text-primary font-medium'
           : ' hover:bg-muted text-foreground'">

            <img th:src="@{/assets/icons/circle-dollar-sign.svg}"
                 alt="Revenues">

            Revenues

        </a>

        <a th:href="@{/manager/details}"
           class="flex items-center gap-3 rounded-lg p-2"
           th:classappend="${activeSidebar == 'HOTEL_DETAILS'}
           ? ' bg-primary/10 text-primary font-medium'
           : ' hover:bg-muted text-foreground'">

            <img th:src="@{/assets/icons/building-2.svg}"
                 alt="Hotel Details">

            Hotel Details

        </a>

        <a th:href="@{/credentials}"
           class="flex items-center gap-3 rounded-lg p-2"
           th:classappend="${activeSidebar == 'CREDENTIALS'}
           ? ' bg-primary/10 text-primary font-medium'
           : ' hover:bg-muted text-foreground'">

            <img th:src="@{/assets/icons/key-square.svg}"
                 alt="Key">

            Credentials

        </a>

    </nav>

    <!-- LOGOUT -->
    <div class="mt-auto pt-4">

        <form th:action="@{/logout}"
              method="post">

            <button type="submit"
                    class="btn btn-danger w-full justify-start">

                <img th:src="@{/assets/icons/log-out.svg}"
                     class="h-5 w-5 brightness-0 invert"
                     alt="Logout">

                Logout
            </button>

        </form>

    </div>

</aside>

</body>
</html>
