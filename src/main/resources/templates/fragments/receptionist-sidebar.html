<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<aside th:fragment="sidebar"
       class="w-64 bg-surface border-r border-border p-5">

    <!-- BRAND -->
    <div class="flex items-center gap-3 mb-8">
        <div class="w-9 h-9 bg-primary rounded-lg"></div>
        <span class="font-semibold text-lg text-text">Hospi</span>
    </div>

    <!-- NAV -->
    <nav class="space-y-1 text-sm">

        <!-- DASHBOARD -->
        <a th:href="@{/receptionist}"
           class="flex items-center gap-3 p-2 rounded-lg"
           th:classappend="${activeSidebar == 'DASHBOARD'}
                ? ' bg-primary/10 text-primary font-medium'
                : ' hover:bg-background text-text'">

            <img th:src="@{/assets/icons/layout-grid.svg}" alt="Dashboard"/>
            Dashboard

        </a>

        <!-- RESERVATIONS -->
        <a th:href="@{/receptionist/reservations}"
           class="flex items-center gap-3 p-2 rounded-lg"
           th:classappend="${activeSidebar == 'RESERVATIONS'}
                ? ' bg-primary/10 text-primary font-medium'
                : ' hover:bg-background text-text'">

            <img th:src="@{/assets/icons/calendar-check.svg}" alt="Reservations"/>
            Reservations

        </a>

        <!-- ROOM STATUS -->
        <a th:href="@{/receptionist/room-status}"
           class="flex items-center gap-3 p-2 rounded-lg"
           th:classappend="${activeSidebar == 'ROOM_STATUS'}
                ? ' bg-primary/10 text-primary font-medium'
                : ' hover:bg-background text-text'">

            <img th:src="@{/assets/icons/bed-double.svg}" alt="Room Status"/>
            Room Status

        </a>

        <!-- NOTIFICATIONS -->
        <a th:href="@{/receptionist/notifications}"
           class="flex items-center justify-between p-2 rounded-lg"
           th:classappend="${activeSidebar == 'NOTIFICATIONS'}
                ? ' bg-primary/10 text-primary font-medium'
                : ' hover:bg-background text-text'">

            <div class="flex items-center gap-3">
                <img th:src="@{/assets/icons/bell.svg}" alt="Notifications"/>
                Notifications
            </div>

            <span class="text-xs bg-accent text-white px-2 py-0.5 rounded-full">
                7
            </span>

        </a>

    </nav>

</aside>

</body>
</html>
