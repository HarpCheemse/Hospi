<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<aside th:fragment="sidebar"
       class="flex h-full w-64 flex-col border-r border-border bg-surface p-5">

    <!-- BRAND -->
    <div class="mb-8 flex items-center gap-3">
        <div class="h-9 w-9 rounded-lg bg-primary"></div>
        <span class="text-lg font-semibold text-foreground">Hospi</span>
    </div>

    <!-- NAV -->
    <nav class="flex-1 overflow-y-auto space-y-1 text-sm">

        <!-- DASHBOARD -->
        <a th:href="@{/receptionist}"
           class="flex items-center gap-3 rounded-lg p-2"
           th:classappend="${activeSidebar == 'DASHBOARD'}
                 ? ' bg-primary/10 text-primary font-medium'
                 : ' hover:bg-muted text-foreground'">

            <img th:src="@{/assets/icons/layout-grid.svg}" alt="Dashboard"/>
            Dashboard

        </a>

        <!-- RESERVATIONS -->
        <a th:href="@{/receptionist/bookings}"
           class="flex items-center gap-3 rounded-lg p-2"
           th:classappend="${activeSidebar == 'ACTIVE_BOOKINGS'}
                 ? ' bg-primary/10 text-primary font-medium'
                 : ' hover:bg-muted text-foreground'">

            <img th:src="@{/assets/icons/calendar-check.svg}" alt="Reservations"/>
            Reservations

        </a>

        <!-- CURRENT STAYS -->
        <a th:href="@{/receptionist/stays}"
           class="flex items-center gap-3 rounded-lg p-2"
           th:classappend="${activeSidebar == 'CURRENT_STAYS'}
                 ? ' bg-primary/10 text-primary font-medium'
                 : ' hover:bg-muted text-foreground'">

            <img th:src="@{/assets/icons/users.svg}" alt="Current Stays"/>
            Current Stays

        </a>

        <!-- ROOM STATUS -->
        <a th:href="@{/receptionist/room-status}"
           class="flex items-center gap-3 rounded-lg p-2"
           th:classappend="${activeSidebar == 'ROOM_STATUS'}
                 ? ' bg-primary/10 text-primary font-medium'
                 : ' hover:bg-muted text-foreground'">

            <img th:src="@{/assets/icons/bed-double.svg}" alt="Room Status"/>
            Room Status

        </a>

        <!-- RECEIPTS -->
        <a th:href="@{/receptionist/receipts}"
           class="flex items-center gap-3 rounded-lg p-2"
           th:classappend="${activeSidebar == 'RECEIPTS'}
                 ? ' bg-primary/10 text-primary font-medium'
                 : ' hover:bg-muted text-foreground'">

            <img th:src="@{/assets/icons/receipt.svg}" alt="Receipts"/>
            Receipts

        </a>

        <!-- NOTIFICATIONS -->
        <a th:href="@{/notifications}"
           class="flex items-center justify-between rounded-lg p-2"
           th:classappend="${activeSidebar == 'NOTIFICATIONS'}
                 ? ' bg-primary/10 text-primary font-medium'
                 : ' hover:bg-muted text-foreground'">

            <div class="flex items-center gap-3">
                <img th:src="@{/assets/icons/bell.svg}" alt="Notifications"/>
                Notifications
            </div>

            <span class="pill-notification"
                  x-data="{ count: [[${unreadNotificationCount}]] }"
                  x-init="setInterval(async () => {
                    const r = await fetch('/notifications/unread-count');
                    count = (await r.json()).body;
                  }, 30000)"
                  x-show="count > 0"
                  x-text="count">0</span>

        </a>

    </nav>

    <!-- LOGOUT -->
    <div class="mt-auto pt-4">
        <form th:action="@{/logout}" method="post" novalidate>
            <button type="submit" class="btn btn-danger w-full justify-start">
                <img th:src="@{/assets/icons/log-out.svg}"
                     class="h-5 w-5 brightness-0 invert" alt="Logout">
                Logout
            </button>
        </form>
    </div>

</aside>

</body>
</html>
