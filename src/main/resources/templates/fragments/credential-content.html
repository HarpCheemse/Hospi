<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<section th:fragment="content" class="max-w-4xl space-y-6">

    <!-- PAGE HEADER -->
    <header class="space-y-1">

        <h1 class="text-2xl font-bold text-text">
            Credentials
        </h1>

        <p class="text-sm text-muted-foreground">
            Manage your account information and security
        </p>

    </header>

    <!-- CARD -->
    <article class="rounded-2xl border border-border bg-surface shadow-card">

        <!-- GRID CONTENT -->
        <div class="grid grid-cols-2 gap-6 p-6">

            <div>
                <p class="text-sm text-muted-foreground">Name</p>
                <p class="mt-1 font-medium text-text"
                   th:text="${view.name}">
                    John Doe
                </p>
            </div>

            <div>
                <p class="text-sm text-muted-foreground">Email</p>
                <p class="mt-1 font-medium text-text truncate"
                   th:text="${view.email}">
                    john@example.com
                </p>
            </div>

            <div>
                <p class="text-sm text-muted-foreground">Role</p>
                <p class="mt-1 font-medium text-text"
                   th:text="${view.role}">
                    MANAGER
                </p>
            </div>

            <div>
                <p class="text-sm text-muted-foreground">Phone</p>
                <p class="mt-1 font-medium text-text"
                   th:text="${view.phone}">
                    0901234567
                </p>
            </div>

            <div>
                <p class="text-sm text-muted-foreground">Status</p>

                <span class="mt-1 inline-flex rounded-full bg-primary-soft px-2 py-1 text-xs font-medium text-primary-dark"
                      th:text="${view.status}">
                    ACTIVE
                </span>

            </div>

            <div>
                <p class="text-sm text-muted-foreground">Created At</p>
                <p class="mt-1 font-medium text-text"
                   th:text="${#temporals.format(view.createdAt, 'dd/MM/yyyy HH:mm')}">
                    01/06/2026 09:30
                </p>
            </div>

        </div>

        <!-- ACTION BAR -->
        <footer class="flex items-center justify-end border-t border-border p-6">

            <a th:href="@{/credentials/change-password}"
               class="rounded-xl bg-primary px-4 py-2 text-sm font-medium text-white shadow-card hover:opacity-90 transition">
                Change Password
            </a>

        </footer>

    </article>

</section>

</body>
</html>
