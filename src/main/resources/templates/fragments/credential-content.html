<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<section th:fragment="content" class="max-w-4xl space-y-6">

    <!-- PAGE HEADER -->
    <div class="staff-page-header">

        <div class="flex items-center gap-4">

            <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-primary/10 text-primary">
                <img th:src="@{/assets/icons/shield-check.svg}" alt="">
            </div>

            <div>
                <h1 class="staff-page-title">Credentials</h1>
                <p class="page-description">Manage your account information and security</p>
            </div>

        </div>

    </div>

    <!-- CARD -->
    <article class="card">

        <div class="border-b border-border px-6 py-5">
            <div class="flex items-center gap-3">
                <img th:src="@{/assets/icons/user.svg}" class="h-5 w-5 text-primary opacity-80" alt="">
                <div><h2 class="text-xl font-semibold">Account Details</h2>
                    <p class="mt-1 text-sm text-muted-foreground">Your profile information and account status.</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-6 p-6">

            <div>
                <p class="text-sm text-muted-foreground">Name</p>
                <p class="mt-1 font-medium text-text"
                   th:text="${view.name}">
                    John Doe
                </p>
            </div>

            <div>
                <p class="text-sm text-muted-foreground">Email</p>
                <p class="mt-1 font-medium text-text truncate"
                   th:text="${view.email}">
                    john@example.com
                </p>
            </div>

            <div>
                <p class="text-sm text-muted-foreground">Role</p>
                <p class="mt-1 font-medium text-text"
                   th:text="${view.role}">
                    MANAGER
                </p>
            </div>

            <div>
                <p class="text-sm text-muted-foreground">Phone</p>
                <p class="mt-1 font-medium text-text"
                   th:text="${view.phone}">
                    0901234567
                </p>
            </div>

            <div>
                <p class="text-sm text-muted-foreground">Status</p>

                <span class="mt-1 inline-flex rounded-full bg-success/10 px-3 py-1 text-xs font-medium text-success"
                      th:text="${view.status}">
                    ACTIVE
                </span>

            </div>

            <div>
                <p class="text-sm text-muted-foreground">Created At</p>
                <p class="mt-1 font-medium text-text"
                   th:text="${#temporals.format(view.createdAt, 'dd/MM/yyyy HH:mm')}">
                    01/06/2026 09:30
                </p>
            </div>

        </div>

        <!-- ACTION BAR -->
        <div class="flex items-center justify-end border-t border-border px-6 py-5">

            <a th:href="@{/credentials/change-password}"
               class="btn btn-primary">
                <img th:src="@{/assets/icons/key-round.svg}" alt="" class="h-4 w-4 brightness-0 invert">
                Change Password
            </a>

        </div>

    </article>

</section>

</body>
</html>
