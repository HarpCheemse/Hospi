<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="toast"
     class="fixed left-4 right-4 top-4 z-50 space-y-3 sm:left-auto sm:right-6 sm:top-6 sm:w-full sm:max-w-sm">

    <div th:if="${success}"
         x-data="{ show: true }"
         x-init="setTimeout(() => show = false, 2000)"
         x-show="show"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-x-4 -translate-y-3 scale-95"
         x-transition:enter-end="opacity-100 translate-x-0 translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-x-0 scale-100"
         x-transition:leave-end="opacity-0 translate-x-4 -translate-y-3 scale-95"
         class="overflow-hidden rounded-2xl border border-primary-soft bg-surface/95 shadow-soft ring-1 ring-primary/10 backdrop-blur-sm">

        <div class="flex gap-3 p-4">

            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-primary-soft text-primary shadow-sm">
                <svg class="h-5 w-5"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M20 6 9 17l-5-5"></path>
                </svg>
            </div>

            <div class="min-w-0 flex-1">
                <div class="flex items-start justify-between gap-3">
                    <div>

                        <p class="mt-0.5 text-sm leading-relaxed text-muted"
                           th:text="${success}">
                        </p>
                    </div>

                    <button type="button"
                            @click="show = false"
                            class="rounded-lg px-2 py-1 text-sm leading-none text-subtle transition hover:bg-background hover:text-text"
                            aria-label="Dismiss notification">
                        &times;
                    </button>
                </div>
            </div>

        </div>

        <div class="h-1 bg-primary"></div>

    </div>

    <div th:if="${error}"
         x-data="{ show: true }"
         x-init="setTimeout(() => show = false, 2000)"
         x-show="show"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-x-4 -translate-y-3 scale-95"
         x-transition:enter-end="opacity-100 translate-x-0 translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-x-0 scale-100"
         x-transition:leave-end="opacity-0 translate-x-4 -translate-y-3 scale-95"
         class="overflow-hidden rounded-2xl border border-danger/30 bg-surface/95 shadow-soft ring-1 ring-danger/10 backdrop-blur-sm">

        <div class="flex gap-3 p-4">

            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-danger/10 text-danger shadow-sm">
                <svg class="h-5 w-5"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 8v4"></path>
                    <path d="M12 16h.01"></path>
                </svg>
            </div>

            <div class="min-w-0 flex-1">
                <div class="flex items-start justify-between gap-3">
                    <div>

                        <p class="mt-0.5 text-sm leading-relaxed text-muted"
                           th:text="${error}">
                        </p>
                    </div>

                    <button type="button"
                            @click="show = false"
                            class="rounded-lg px-2 py-1 text-sm leading-none text-subtle transition hover:bg-background hover:text-text"
                            aria-label="Dismiss notification">
                        &times;
                    </button>
                </div>
            </div>

        </div>

        <div class="h-1 bg-danger"></div>

    </div>

</div>

</body>
</html>
