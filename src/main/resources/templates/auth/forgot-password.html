<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Hospi</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="bg-background text-text">

<div class="min-h-screen flex items-center justify-center px-6">

    <div class="w-full max-w-md">

        <!-- BRAND -->
        <div class="mb-8 text-center">

            <div class="mx-auto mb-3 h-12 w-12 rounded-xl bg-primary"></div>

            <h1 class="text-2xl font-bold">
                Forgot Password
            </h1>

            <p class="mt-1 text-sm text-muted-foreground">
                Enter your email to receive a password reset link
            </p>

        </div>

        <!-- CARD -->
        <div class="rounded-2xl border border-border bg-surface shadow-card p-6">

            <!-- FORM -->
            <form th:action="@{/auth/password/forgot}"
                  th:object="${form}"
                  method="post"
                  novalidate>

                <!-- EMAIL -->
                <div class="mb-4">

                    <label class="mb-2 block text-sm font-medium">
                        Email
                    </label>

                    <input type="email"
                           th:field="*{email}"
                           class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary"
                           placeholder="you@hospi.com"
                           required>
                    <div th:replace="fragments/form-error :: error('email')"></div>
                </div>

                <!-- BUTTON -->
                <button type="submit"
                        class="w-full rounded-xl bg-primary px-4 py-3 text-sm font-medium text-white shadow-card hover:opacity-90">

                    Send Reset Link

                </button>

            </form>

        </div>

        <!-- BACK TO LOGIN -->
        <p class="mt-6 text-center text-sm text-muted-foreground">
            Remember your password?
            <a th:href="@{/login}"
               class="text-primary hover:underline">
                Sign in
            </a>
        </p>

    </div>

</div>

</body>
</html>
