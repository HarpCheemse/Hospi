<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | Hospi</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="h-screen bg-background text-text flex items-center justify-center">

<!-- CENTER WRAPPER -->
<main class="w-full max-w-md mx-auto p-6">

    <!-- HEADER -->
    <header class="mb-6 text-center space-y-2">

        <h1 class="text-2xl font-bold">
            Change Password
        </h1>

        <p class="text-sm text-muted-foreground">
            Update your password to keep your account secure
        </p>

    </header>

    <!-- FORM CARD -->
    <form th:action="@{/credentials/change-password}"
          th:object="${form}"
          method="post"
          novalidate
          class="rounded-2xl border border-border bg-surface shadow-card">

        <div class="p-6 space-y-5">

            <!-- Current Password -->
            <div>
                <label class="text-sm text-muted-foreground">
                    Current Password <span class="text-danger">*</span>
                </label>

                <input type="password"
                       th:field="*{currentPassword}"
                       class="mt-1 w-full rounded-xl border border-border bg-background px-4 py-2 text-text focus:outline-none focus:ring-2 focus:ring-primary/30">
                <div th:replace="~{fragments/form-error :: error('currentPassword')}"></div>
            </div>

            <!-- New Password -->
            <div>
                <label class="text-sm text-muted-foreground">
                    New Password <span class="text-danger">*</span>
                </label>

                <input type="password"
                       th:field="*{newPassword}"
                       class="mt-1 w-full rounded-xl border border-border bg-background px-4 py-2 text-text focus:outline-none focus:ring-2 focus:ring-primary/30">
                <div th:replace="~{fragments/form-error :: error('newPassword')}"></div>
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="text-sm text-muted-foreground">
                    Confirm New Password <span class="text-danger">*</span>
                </label>

                <input type="password"
                       th:field="*{confirmPassword}"
                       class="mt-1 w-full rounded-xl border border-border bg-background px-4 py-2 text-text focus:outline-none focus:ring-2 focus:ring-primary/30">
                <div th:replace="~{fragments/form-error :: error('confirmPassword')}"></div>
            </div>

        </div>

        <!-- ACTIONS -->
        <div class="flex items-center justify-end gap-3 border-t border-border p-6">

            <a href="javascript:history.back()"
               class="rounded-xl border border-border bg-background px-4 py-2 text-sm font-medium hover:bg-background/70">
                Cancel
            </a>

            <button type="submit"
                    class="rounded-xl bg-primary px-4 py-2 text-sm font-medium text-white shadow-card hover:opacity-90">
                Update Password
            </button>

        </div>

    </form>

</main>

</body>
</html>
