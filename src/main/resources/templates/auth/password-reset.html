<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="min-h-screen flex items-center justify-center bg-background px-4">

<div class="w-full max-w-md rounded-2xl border border-border bg-surface p-8 shadow-sm">

    <div class="mb-6">
        <h1 class="text-2xl font-semibold">
            Reset Password
        </h1>

        <p class="mt-2 text-sm text-muted-foreground">
            Enter your new password below.
        </p>
    </div>

    <form th:action="@{/auth/password/reset}"
          th:object="${form}"
          method="post"
          class="space-y-5">

        <!-- New Password -->
        <div>
            <label class="mb-2 block text-sm font-medium">
                New Password
            </label>

            <input type="password"
                   th:field="*{newPassword}"
                   class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary"
                   placeholder="Enter new password">
            
            <input type="hidden" name="token" th:value="${token}">

            <div th:replace="fragments/form-error :: error('newPassword')"></div>
        </div>

        <!-- Confirm Password -->
        <div>
            <label class="mb-2 block text-sm font-medium">
                Confirm Password
            </label>

            <input type="password"
                   th:field="*{confirmPassword}"
                   class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-primary"
                   placeholder="Confirm new password">

            <div th:replace="fragments/form-error :: error('confirmPassword')"></div>
        </div>

        <div class="flex gap-3 pt-2">
            <a th:href="@{/login}"
               class="flex-1 rounded-xl border border-border px-4 py-3 text-center text-sm font-medium hover:bg-background">
                Cancel
            </a>

            <button type="submit"
                    class="flex-1 rounded-xl bg-primary px-4 py-3 text-sm font-medium text-primary-foreground">
                Reset Password
            </button>
        </div>

    </form>

</div>

</body>
</html>
