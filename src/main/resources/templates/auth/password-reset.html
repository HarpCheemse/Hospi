<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="min-h-screen flex items-center justify-center bg-background px-4">

    <div class="w-full max-w-md rounded-2xl border border-border bg-surface p-8 shadow-sm">

    <div class="mb-6 text-center">
        <div class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-primary/10 text-primary">
            <img th:src="@{/assets/icons/key-square.svg}" alt="" class="h-6 w-6">
        </div>
        <h1 class="text-2xl font-bold">
            Reset Password
        </h1>

        <p class="mt-1 text-sm text-muted-foreground">
            Enter your new password below.
        </p>
    </div>

    <form th:action="@{/auth/password/reset}"
          th:object="${form}"
          method="post"
          class="space-y-5"
          novalidate>

        <!-- New Password -->
        <div>
            <label class="mb-2 block text-sm font-medium">
                New Password
            </label>

            <input type="password"
                   th:field="*{newPassword}"
                   class="input"
                   placeholder="Enter new password">
            
            <input type="hidden" name="token" th:value="${token}">

            <div th:replace="~{fragments/form-error :: error('newPassword')}"></div>
        </div>

        <!-- Confirm Password -->
        <div>
            <label class="mb-2 block text-sm font-medium">
                Confirm Password
            </label>

            <input type="password"
                   th:field="*{confirmPassword}"
                   class="input"
                   placeholder="Confirm new password">

            <div th:replace="~{fragments/form-error :: error('confirmPassword')}"></div>
        </div>

        <div class="flex gap-3 pt-2">
            <a th:href="@{/login}"
               class="btn btn-secondary flex-1">
                Cancel
            </a>

            <button type="submit"
                    class="btn btn-primary flex-1">
                Reset Password
            </button>
        </div>

    </form>

</div>

</body>
</html>
