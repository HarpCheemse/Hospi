<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Hospi</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="bg-background text-text">

<div class="min-h-screen flex items-center justify-center px-6">

    <div class="w-full max-w-md">

        <!-- BRAND -->
        <div class="mb-8 text-center">

            <div class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-primary/10 text-primary">
                <img th:src="@{/assets/icons/log-out.svg}" alt="" class="h-6 w-6">
            </div>

            <h1 class="text-2xl font-bold">
                Sign In
            </h1>

            <p class="mt-1 text-sm text-muted-foreground">
                Sign in to your staff account
            </p>

        </div>

        <!-- CARD -->
        <div class="rounded-2xl border border-border bg-surface shadow-card p-6">

            <!-- ERROR -->
            <div th:if="${param.error}"
                 class="mb-4 rounded-xl bg-danger/10 px-4 py-3 text-sm text-danger">

                Invalid email or password

            </div>

            <!-- LOGOUT -->
            <div th:if="${param.logout}"
                 class="mb-4 rounded-xl bg-primary-soft px-4 py-3 text-sm text-primary-dark">

                You have been logged out successfully

            </div>

            <!-- FORM -->
            <form th:object="${form}" th:action="@{/login}" method="post" novalidate>

                <!-- EMAIL -->
                <div class="mb-4">

                    <label class="mb-2 block text-sm font-medium">
                        Email
                    </label>

                    <input type="email"
                           name="email"
                           class="input"
                           placeholder="you@hospi.com"
                           required>

                </div>

                <!-- PASSWORD -->
                <div class="mb-2">

                    <label class="mb-2 block text-sm font-medium">
                        Password
                    </label>

                    <input type="password"
                           name="password"
                           class="input"
                           placeholder="••••••••"
                           required>

                </div>

                <input type="checkbox" name="remember-me"> Remember me

                <!-- FORGOT PASSWORD -->
                <div class="mb-4 flex justify-end">

                    <a th:href="@{/auth/password/forgot}"
                       class="text-sm text-primary hover:underline">
                        Forgot password?
                    </a>

                </div>
                <!-- BUTTON -->
                <button type="submit"
                        class="btn btn-primary w-full">
                    Sign In
                </button>

            </form>

        </div>

        <!-- FOOTER -->
        <p class="mt-6 text-center text-xs text-muted-foreground">
            © 2026 Hospi. Internal staff system.
        </p>

    </div>

</div>

</body>
</html>
